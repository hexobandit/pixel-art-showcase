<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>03 · Fishing Pier</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="scene">
  <a class="back-link" href="../index.html">← gallery</a>
  <div class="scene-label">03 · fishing pier</div>
  <script src="../shared/engine.js"></script>
  <script>
  (function () {
    const scene = Pixel.createScene({ width: 180, height: 320 });
    const P = Pixel.PALETTE;
    const { fillRect, lerpColor, clamp, pixel, clear } = Pixel;

    const HORIZON = 130;
    const PIER_Y  = 196;        // top of pier deck
    const PIER_DECK_H = 4;
    let time = 0;

    // Sun cycle: 0=high noon, 1=set below horizon
    const SUN_CYCLE = 60; // seconds for full set
    let sunT = 0.35;

    // Boats drifting
    const boats = [];
    for (let i = 0; i < 2; i++) {
      boats.push({
        x: Math.random() * 180,
        y: 150 + Math.random() * 18,
        vx: 4 + Math.random() * 4,
        bob: Math.random() * Math.PI * 2,
        sail: [P.white, P.amber, P.red][Math.floor(Math.random() * 3)],
      });
    }

    // Seagulls
    const gulls = [];
    function spawnGull() {
      gulls.push({
        x: Math.random() < 0.5 ? -8 : 188,
        y: 30 + Math.random() * 70,
        vx: (Math.random() < 0.5 ? -1 : 1) * (16 + Math.random() * 8),
        flap: Math.random() * 10,
        bob: Math.random() * 10,
      });
      gulls[gulls.length - 1].vx = gulls[gulls.length - 1].x < 0 ? Math.abs(gulls[gulls.length - 1].vx) : -Math.abs(gulls[gulls.length - 1].vx);
    }
    for (let i = 0; i < 3; i++) spawnGull();

    // Ripples (from taps)
    const ripples = [];

    // Fish bites (game seed)
    let fishBiteT = 0; // > 0 = currently biting
    let nextBite = 4 + Math.random() * 6;
    let lineWiggle = 0;

    scene.onTap((x, y) => {
      // Tap on water → ripple
      if (y > HORIZON + 6 && y < 320) {
        ripples.push({ x, y, t: 0, life: 1.4 });
      }
    });

    function update(dt) {
      time += dt;
      sunT = (sunT + dt / SUN_CYCLE) % 1.6; // overshoot then loop
      if (sunT > 1.4) sunT = 0; // restart at high

      for (const b of boats) {
        b.x += b.vx * dt;
        b.bob += dt * 1.5;
        if (b.x > 196) b.x = -16;
      }

      for (let i = gulls.length - 1; i >= 0; i--) {
        const g = gulls[i];
        g.x += g.vx * dt;
        g.flap += dt * 10;
        g.bob += dt * 1.4;
        if ((g.vx > 0 && g.x > 196) || (g.vx < 0 && g.x < -16)) gulls.splice(i, 1);
      }
      if (gulls.length < 3 && Math.random() < dt * 0.5) spawnGull();

      // Auto-ripples (small ambient)
      if (Math.random() < dt * 0.6) {
        ripples.push({
          x: Math.random() * 180,
          y: HORIZON + 8 + Math.random() * 180,
          t: 0, life: 1.0, ambient: true,
        });
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].t += dt;
        if (ripples[i].t > ripples[i].life) ripples.splice(i, 1);
      }

      // Fish bite cycle
      nextBite -= dt;
      if (nextBite <= 0 && fishBiteT <= 0) {
        fishBiteT = 1.5 + Math.random() * 1.5;
        nextBite = 6 + Math.random() * 8;
        // ripple at line tip
        ripples.push({ x: 56, y: 240, t: 0, life: 1.0 });
      }
      if (fishBiteT > 0) {
        fishBiteT -= dt;
        lineWiggle = Math.sin(time * 14) * 1.5;
      } else {
        lineWiggle *= 0.9;
      }
    }

    // Sky color shifts as sun goes down
    function skyColors() {
      // sunT 0..0.5: noon to golden
      // sunT 0.5..1.0: golden to dusk
      // sunT 1.0..1.4: dusk to night (sun below horizon)
      const top = sunT < 0.4 ? lerpColor(P.blue, P.navy, sunT / 0.4)
                : sunT < 0.9 ? lerpColor(P.navy, P.purple, (sunT - 0.4) / 0.5)
                :              lerpColor(P.purple, P.dark_gray, clamp((sunT - 0.9) / 0.5, 0, 1));
      const mid = sunT < 0.4 ? lerpColor(P.cyan, P.amber, sunT / 0.4)
                : sunT < 0.9 ? lerpColor(P.amber, P.mauve, (sunT - 0.4) / 0.5)
                :              lerpColor(P.mauve, P.very_dark, clamp((sunT - 0.9) / 0.5, 0, 1));
      const bot = sunT < 0.4 ? lerpColor(P.sand, P.yellow, sunT / 0.4)
                : sunT < 0.9 ? lerpColor(P.yellow, P.orange, (sunT - 0.4) / 0.5)
                :              lerpColor(P.orange, P.dark_brown, clamp((sunT - 0.9) / 0.5, 0, 1));
      return { top, mid, bot };
    }

    function drawSky(ctx) {
      const { top, mid, bot } = skyColors();
      for (let y = 0; y < HORIZON; y++) {
        const t = y / HORIZON;
        let c;
        if (t < 0.5) c = lerpColor(top, mid, t * 2);
        else         c = lerpColor(mid, bot, (t - 0.5) * 2);
        fillRect(ctx, 0, y, 180, 1, c);
      }
    }

    function sunPosition() {
      const sx = 90;                         // stays roughly centered
      const sy = 30 + sunT * 110;            // moves down across sky
      return { sx, sy };
    }

    function drawSun(ctx) {
      const { sx, sy } = sunPosition();
      if (sy > HORIZON + 6) return; // gone
      const above = sy < HORIZON;
      const sunColor = sunT < 0.4 ? P.yellow
                     : sunT < 0.9 ? P.orange
                     :              P.red;
      // soft halo
      ctx.globalAlpha = 0.18;
      fillRect(ctx, sx - 14, sy - 14, 28, 28, sunColor);
      ctx.globalAlpha = 0.28;
      fillRect(ctx, sx - 9, sy - 9, 18, 18, sunColor);
      ctx.globalAlpha = 1;
      // disc
      const r = 6;
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt(r * r - dy * dy));
        if (w < 0) continue;
        const cy = sy + dy;
        if (above && cy >= HORIZON) continue;
        fillRect(ctx, sx - w, cy, w * 2 + 1, 1, sunColor);
      }
    }

    function drawWater(ctx) {
      // Water gradient: lighter near horizon, darker foreground
      const surfaceColor = sunT < 0.5 ? P.blue : lerpColor(P.blue, P.purple, (sunT - 0.5) * 2);
      const deepColor    = sunT < 0.5 ? P.navy : lerpColor(P.navy, P.dark_gray, (sunT - 0.5) * 2);
      for (let y = HORIZON; y < 320; y++) {
        const t = (y - HORIZON) / (320 - HORIZON);
        fillRect(ctx, 0, y, 180, 1, lerpColor(surfaceColor, deepColor, t));
      }

      // Sun reflection on water
      const { sx, sy } = sunPosition();
      if (sy < HORIZON + 30) {
        const reflectColor = sunT < 0.4 ? P.yellow : sunT < 0.9 ? P.orange : P.red;
        ctx.globalAlpha = 0.6;
        for (let y = HORIZON + 1; y < HORIZON + 80; y++) {
          const dist = y - HORIZON;
          const w = Math.max(0, 8 - Math.floor(dist / 8));
          const wave = Math.sin(time * 3 + y * 0.5) * 1.2;
          // dotted reflection — don't fill every line
          if ((y + Math.floor(time * 8)) % 3 !== 0) continue;
          fillRect(ctx, sx - w + Math.round(wave), y, w * 2, 1, reflectColor);
        }
        ctx.globalAlpha = 1;
      }

      // Wave crests scattered across water
      const crestColor = sunT < 0.5 ? P.cyan : lerpColor(P.cyan, P.pink, (sunT - 0.5) * 1.6);
      for (let band = 0; band < 14; band++) {
        const y = HORIZON + 4 + band * 12;
        const offset = Math.sin(time * 1.2 + band * 0.7) * 8;
        for (let dot = 0; dot < 3; dot++) {
          const x = ((band * 53 + dot * 71 + Math.floor(time * 6)) % 180);
          ctx.globalAlpha = 0.6;
          fillRect(ctx, x + offset, y, 2, 1, crestColor);
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawBoat(ctx, b) {
      const x = Math.floor(b.x);
      const y = Math.floor(b.y + Math.sin(b.bob) * 0.5);
      // Hull
      fillRect(ctx, x, y + 2, 12, 2, P.brown);
      fillRect(ctx, x + 1, y + 1, 10, 1, P.dark_brown);
      // Mast
      fillRect(ctx, x + 6, y - 6, 1, 7, P.dark_brown);
      // Sail (triangle approx)
      for (let dy = 0; dy < 6; dy++) {
        fillRect(ctx, x + 7, y - 6 + dy, dy + 1, 1, b.sail);
      }
    }

    function drawGull(ctx, g) {
      const flap = Math.floor(g.flap) % 3;
      const x = Math.floor(g.x), y = Math.floor(g.y + Math.sin(g.bob) * 1);
      const c = P.white;
      const dim = lerpColor(P.white, P.gray, sunT > 0.6 ? 0.5 : 0);
      const col = sunT < 0.5 ? c : dim;
      if (flap === 0) {
        pixel(ctx, x, y, col); pixel(ctx, x + 1, y - 1, col); pixel(ctx, x + 2, y - 1, col);
        pixel(ctx, x + 3, y, col); pixel(ctx, x - 1, y, col); pixel(ctx, x + 4, y, col);
      } else if (flap === 1) {
        pixel(ctx, x, y, col); pixel(ctx, x + 1, y, col); pixel(ctx, x + 2, y, col);
        pixel(ctx, x + 3, y, col); pixel(ctx, x + 4, y, col);
      } else {
        pixel(ctx, x + 1, y, col); pixel(ctx, x + 2, y, col); pixel(ctx, x + 3, y, col);
        pixel(ctx, x, y + 1, col); pixel(ctx, x + 4, y + 1, col);
      }
    }

    function drawPier(ctx) {
      // Posts
      for (let px = 8; px <= 96; px += 22) {
        fillRect(ctx, px, PIER_Y + PIER_DECK_H, 2, 38, P.dark_brown);
      }
      // Deck
      fillRect(ctx, 0, PIER_Y, 110, PIER_DECK_H, P.brown);
      fillRect(ctx, 0, PIER_Y, 110, 1, P.rust);
      // Plank lines
      for (let lx = 6; lx < 110; lx += 8) pixel(ctx, lx, PIER_Y + 2, P.dark_brown);
      // Railing posts (small)
      for (let rx = 2; rx < 110; rx += 14) {
        fillRect(ctx, rx, PIER_Y - 4, 1, 4, P.dark_brown);
      }
      // Railing top
      fillRect(ctx, 2, PIER_Y - 4, 108, 1, P.brown);
    }

    function drawFisherman(ctx) {
      const x = 50, y = PIER_Y - 14;
      // Legs
      fillRect(ctx, x, y + 8, 4, 4, P.navy);
      // Body
      fillRect(ctx, x - 1, y + 4, 6, 4, P.red);
      // Head
      fillRect(ctx, x + 1, y + 1, 3, 3, P.skin);
      // Hat
      fillRect(ctx, x, y, 5, 1, P.dark_brown);
      fillRect(ctx, x + 1, y - 1, 3, 1, P.dark_brown);
      // Arm + rod
      fillRect(ctx, x + 5, y + 5, 1, 3, P.skin);
      // Rod (diagonal)
      ctx.strokeStyle = P.dark_brown;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 6, y + 5.5);
      ctx.lineTo(x + 18, y - 4.5);
      ctx.stroke();
      // Fishing line
      ctx.strokeStyle = P.light_gray;
      ctx.beginPath();
      ctx.moveTo(x + 18, y - 4);
      ctx.lineTo(56 + lineWiggle, 240);
      ctx.stroke();
      // Bobber at end
      pixel(ctx, Math.floor(56 + lineWiggle), 239, P.red);
      pixel(ctx, Math.floor(56 + lineWiggle), 240, P.white);
    }

    function drawRipple(ctx, r) {
      const t = r.t / r.life;
      const radius = t * (r.ambient ? 4 : 10);
      const color = sunT < 0.5 ? P.cyan : P.peach;
      ctx.globalAlpha = (1 - t) * (r.ambient ? 0.4 : 0.9);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      if (!r.ambient && radius > 4) {
        ctx.beginPath();
        ctx.arc(r.x, r.y, radius - 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function draw(ctx) {
      drawSky(ctx);
      drawSun(ctx);
      drawWater(ctx);

      // Distant land hint on horizon
      ctx.globalAlpha = 0.3;
      fillRect(ctx, 0, HORIZON - 1, 180, 1, P.dark_brown);
      ctx.globalAlpha = 1;

      // Boats (mid-distance, behind pier)
      for (const b of boats) drawBoat(ctx, b);

      // Ripples
      for (const r of ripples) drawRipple(ctx, r);

      // Pier + fisherman
      drawPier(ctx);
      drawFisherman(ctx);

      // Gulls (foreground sky)
      for (const g of gulls) drawGull(ctx, g);
    }

    scene.start({ update, draw });
  })();
  </script>
</body>
</html>
