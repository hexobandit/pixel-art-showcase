<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>04 · Twilight Skyline</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="scene">
  <a class="back-link" href="../index.html">← gallery</a>
  <div class="scene-label">04 · twilight skyline</div>
  <script src="../shared/engine.js"></script>
  <script>
  (function () {
    const scene = Pixel.createScene({ width: 180, height: 320 });
    const P = Pixel.PALETTE;
    const { fillRect, lerpColor, clamp, pixel } = Pixel;

    const COL = {
      sky_top:      '#1a1a3c',
      sky_bot:      '#2c2c52',
      star:         '#e0e0ff',

      cloud:        '#a4d2c4',
      cloud_d:      '#7cb2a4',

      distant_a:    '#6a7a96',
      distant_b:    '#5a6a86',
      distant_c:    '#4a5a78',

      mid_a:        '#3a4564',
      mid_b:        '#2c3550',
      mid_dark:     '#1e2238',

      fg_brown:     '#6a4836',
      fg_brown_d:   '#4a2e1e',
      fg_brown_h:   '#8a5a44',

      fg_warm:      '#9a5a3e',
      fg_warm_d:    '#6a3a26',
      fg_warm_h:    '#bd7e58',

      fg_gray:      '#4a5572',
      fg_gray_d:    '#34405a',
      fg_gray_h:    '#5e6884',

      win_warm:     '#e89058',
      win_warm_b:   '#f5b078',
      win_yellow:   '#fac678',
      win_dim:      '#231720',

      trim:         '#1a1228',
      roof_dark:    '#2a2438',
      roof_brown:   '#3a2a26',
      roof_red:     '#7a3a30',

      tree:         '#7ac4a8',
      tree_d:       '#5a9682',

      lamp_post:    '#1a1228',
      lamp_glow:    '#feae34',
      lamp_core:    '#fee761',

      street:       '#1a1430',
      sidewalk:     '#2a2440',
    };

    let time = 0;

    // ---------- Stars ----------
    const stars = [];
    for (let i = 0; i < 22; i++) {
      stars.push({
        x: Math.floor(Math.random() * 180),
        y: Math.floor(Math.random() * 60),
        twinkle: Math.random() * 10,
      });
    }

    // ---------- Cloud bands ----------
    const clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: -20 + i * 50 + Math.random() * 30,
        y: 56 + (i % 2) * 14 + Math.random() * 6,
        w: 44 + Math.floor(Math.random() * 36),
        speed: 0.6 + Math.random() * 0.8,
      });
    }

    // ---------- Distant skyline ----------
    const DISTANT_BASE = 200;
    const distantBuildings = [
      { x: 4,   w: 6,  h: 130, color: COL.distant_a, style: 'banded' },
      { x: 10,  w: 14, h: 90,  color: COL.distant_b, style: 'simple' },
      { x: 26,  w: 4,  h: 70,  color: COL.distant_a, style: 'simple' },
      { x: 32,  w: 22, h: 110, color: COL.distant_b, style: 'windows' },
      { x: 54,  w: 12, h: 95,  color: COL.distant_a, style: 'simple' },
      { x: 68,  w: 5,  h: 140, color: COL.distant_b, style: 'simple', spire: 4 },
      { x: 76,  w: 18, h: 105, color: COL.distant_a, style: 'windows' },
      { x: 96,  w: 14, h: 88,  color: COL.distant_b, style: 'simple' },
      { x: 110, w: 22, h: 120, color: COL.distant_a, style: 'windows' },
      { x: 132, w: 16, h: 92,  color: COL.distant_b, style: 'simple' },
      { x: 148, w: 10, h: 76,  color: COL.distant_a, style: 'simple' },
      { x: 156, w: 22, h: 100, color: COL.distant_b, style: 'windows' },
    ];
    for (const b of distantBuildings) {
      b.windows = [];
      if (b.style === 'windows') {
        for (let cy = 4; cy + 1 < b.h - 4; cy += 4) {
          for (let cx = 1; cx + 1 < b.w - 1; cx += 3) {
            if (Math.random() < 0.5) {
              b.windows.push({ x: cx, y: cy, lit: Math.random() < 0.7 });
            }
          }
        }
      } else if (b.style === 'banded') {
        for (let cy = 3; cy < b.h - 3; cy += 4) {
          b.windows.push({ x: 0, y: cy, banded: true });
        }
      }
    }

    // ---------- Mid skyline ----------
    const MID_BASE = 222;
    const midBuildings = [
      { x: -2,  w: 22, h: 76,  color: COL.mid_a },
      { x: 18,  w: 14, h: 102, color: COL.mid_b, antenna: 6 },
      { x: 30,  w: 24, h: 86,  color: COL.mid_a },
      { x: 52,  w: 18, h: 72,  color: COL.mid_b },
      { x: 68,  w: 12, h: 60,  color: COL.mid_dark },
      { x: 78,  w: 22, h: 108, color: COL.mid_a, antenna: 8 },
      { x: 98,  w: 20, h: 84,  color: COL.mid_b },
      { x: 116, w: 16, h: 70,  color: COL.mid_a },
      { x: 130, w: 14, h: 92,  color: COL.mid_b, antenna: 5 },
      { x: 142, w: 22, h: 78,  color: COL.mid_a },
      { x: 162, w: 20, h: 66,  color: COL.mid_b },
    ];
    for (const b of midBuildings) {
      b.windows = [];
      for (let cy = 4; cy + 2 < b.h - 4; cy += 5) {
        for (let cx = 2; cx + 2 < b.w - 2; cx += 4) {
          b.windows.push({
            x: cx, y: cy, w: 2, h: 2,
            lit: Math.random() < 0.6,
            color: Math.random() < 0.85 ? COL.win_warm : COL.win_yellow,
            flicker: Math.random() < 0.05,
            phase: Math.random() * 10,
          });
        }
      }
    }

    // ---------- Foreground buildings ----------
    const fgBuildings = [];
    function addFg(opts) {
      const b = Object.assign({
        x: 0, y: 0, w: 30, h: 100,
        color: COL.fg_brown,
        shade: COL.fg_brown_d,
        highlight: COL.fg_brown_h,
        roof: COL.roof_dark,
        pitched: false,
        roofPeak: 0,
        rooftop: false,
        winRows: 0, winCols: 0,
      }, opts);
      fgBuildings.push(b);
    }

    addFg({ x: 0,   y: 218, w: 28, h: 102, color: COL.fg_brown, shade: COL.fg_brown_d, highlight: COL.fg_brown_h, roof: COL.roof_brown });
    addFg({ x: 28,  y: 246, w: 20, h: 74,  color: COL.fg_gray,  shade: COL.fg_gray_d,  highlight: COL.fg_gray_h,  roof: COL.roof_dark });
    addFg({ x: 48,  y: 230, w: 22, h: 90,  color: COL.fg_brown, shade: COL.fg_brown_d, highlight: COL.fg_brown_h, roof: COL.roof_red, pitched: true, roofPeak: 8 });
    addFg({ x: 70,  y: 213, w: 36, h: 107, color: COL.fg_warm,  shade: COL.fg_warm_d,  highlight: COL.fg_warm_h,  roof: COL.roof_dark });
    addFg({ x: 106, y: 244, w: 24, h: 76,  color: COL.fg_gray,  shade: COL.fg_gray_d,  highlight: COL.fg_gray_h,  roof: COL.roof_dark, pitched: true, roofPeak: 7 });
    addFg({ x: 130, y: 213, w: 28, h: 107, color: COL.fg_warm,  shade: COL.fg_warm_d,  highlight: COL.fg_warm_h,  roof: COL.roof_dark, rooftop: true });
    addFg({ x: 158, y: 240, w: 22, h: 80,  color: COL.fg_brown, shade: COL.fg_brown_d, highlight: COL.fg_brown_h, roof: COL.roof_dark });

    // Generate windows for FG buildings (regular grid based on facade size)
    for (const b of fgBuildings) {
      b.windows = [];
      const facadeStartY = (b.pitched ? b.y + b.roofPeak + 2 : b.y + 4);
      const facadeEndY = b.y + b.h - 8;
      const cols = Math.max(2, Math.floor((b.w - 6) / 6));
      const rowH = 9;
      const winW = Math.max(2, Math.floor((b.w - 6) / cols) - 2);
      const winH = 5;
      const rows = Math.max(2, Math.floor((facadeEndY - facadeStartY) / rowH));
      const colStep = (b.w - 4) / cols;
      for (let r = 0; r < rows; r++) {
        const cy = facadeStartY + r * rowH;
        for (let c = 0; c < cols; c++) {
          const cx = b.x + 2 + Math.round(c * colStep + (colStep - winW) / 2);
          b.windows.push({
            x: cx, y: cy, w: winW, h: winH,
            lit: Math.random() < 0.78,
            color: Math.random() < 0.92 ? COL.win_warm : COL.win_yellow,
            flicker: Math.random() < 0.06,
            phase: Math.random() * 10,
          });
        }
      }
    }

    // ---------- Trees & lamps ----------
    const trees = [
      { x: 50, y: 308, r: 3 },
      { x: 102, y: 308, r: 2 },
      { x: 138, y: 308, r: 3 },
      { x: 16, y: 312, r: 2 },
      { x: 168, y: 310, r: 3 },
    ];
    const lamps = [
      { x: 76, y: 305 },
      { x: 154, y: 305 },
    ];

    // ---------- Tap: flash a foreground building ----------
    let flashedBldg = null;
    let flashT = 0;
    scene.onTap((x, y) => {
      for (let i = fgBuildings.length - 1; i >= 0; i--) {
        const b = fgBuildings[i];
        if (x >= b.x && x < b.x + b.w && y >= b.y && y <= b.y + b.h) {
          flashedBldg = b;
          flashT = 0.9;
          return;
        }
      }
    });

    // ---------- Update ----------
    function update(dt) {
      time += dt;
      for (const c of clouds) {
        c.x += c.speed * dt;
        if (c.x > 200) {
          c.x = -c.w - 8;
          c.y = 50 + Math.random() * 32;
        }
      }
      if (flashT > 0) flashT -= dt;
    }

    // ---------- Drawing ----------
    function drawSky(ctx) {
      for (let y = 0; y < 200; y++) {
        const t = y / 200;
        fillRect(ctx, 0, y, 180, 1, lerpColor(COL.sky_top, COL.sky_bot, t * 0.7));
      }
    }

    function drawStars(ctx) {
      for (const s of stars) {
        const tw = (Math.sin(time * 1.5 + s.twinkle) > 0.2);
        if (tw) pixel(ctx, s.x, s.y, COL.star);
        else pixel(ctx, s.x, s.y, lerpColor(COL.star, COL.sky_top, 0.5));
      }
    }

    function drawCloud(ctx, c) {
      const cx = Math.round(c.x), cy = Math.round(c.y), cw = c.w;
      fillRect(ctx, cx, cy, cw, 3, COL.cloud);
      fillRect(ctx, cx + 4, cy - 2, cw - 8, 1, COL.cloud);
      fillRect(ctx, cx + 8, cy - 3, Math.max(2, cw - 16), 1, COL.cloud);
      fillRect(ctx, cx + 2, cy + 3, cw - 4, 1, COL.cloud_d);
    }

    function drawDistantBuilding(ctx, b) {
      const top = DISTANT_BASE - b.h;
      fillRect(ctx, b.x, top, b.w, b.h, b.color);
      fillRect(ctx, b.x, top, b.w, 1, lerpColor(b.color, '#000', 0.3));
      fillRect(ctx, b.x + b.w - 1, top, 1, b.h, lerpColor(b.color, '#000', 0.25));
      // Spire
      if (b.spire) {
        fillRect(ctx, b.x + Math.floor(b.w / 2), top - b.spire, 1, b.spire, lerpColor(b.color, '#000', 0.4));
      }
      for (const w of b.windows) {
        if (w.banded) {
          fillRect(ctx, b.x, top + w.y, b.w, 1, lerpColor(b.color, '#000', 0.35));
          if (Math.random() < 0.0001) {} // placeholder, banded windows are static
        } else if (w.lit) {
          pixel(ctx, b.x + w.x, top + w.y, COL.win_warm);
        }
      }
    }

    function drawMidBuilding(ctx, b) {
      const top = MID_BASE - b.h;
      fillRect(ctx, b.x, top, b.w, b.h, b.color);
      fillRect(ctx, b.x, top, b.w, 1, lerpColor(b.color, '#000', 0.4));
      fillRect(ctx, b.x + b.w - 1, top, 1, b.h, lerpColor(b.color, '#000', 0.3));
      if (b.antenna) {
        const ax = b.x + Math.floor(b.w / 2);
        fillRect(ctx, ax, top - b.antenna, 1, b.antenna, lerpColor(b.color, '#000', 0.5));
      }
      for (const w of b.windows) {
        let on = w.lit;
        if (w.flicker) on = (Math.sin(time * 2 + w.phase) > -0.2);
        const c = on ? w.color : lerpColor(b.color, '#000', 0.4);
        fillRect(ctx, b.x + w.x, top + w.y, w.w, w.h, c);
      }
    }

    function drawFgBuilding(ctx, b) {
      // Body
      fillRect(ctx, b.x, b.y, b.w, b.h, b.color);
      // Edges
      fillRect(ctx, b.x, b.y, 1, b.h, b.highlight);
      fillRect(ctx, b.x + b.w - 1, b.y, 1, b.h, b.shade);

      // Roof
      if (b.pitched) {
        for (let dy = 0; dy < b.roofPeak; dy++) {
          const inset = b.roofPeak - dy;
          fillRect(ctx, b.x + inset, b.y + dy, b.w - inset * 2, 1, b.roof);
        }
        fillRect(ctx, b.x, b.y + b.roofPeak, b.w, 2, b.roof);
        fillRect(ctx, b.x, b.y + b.roofPeak + 2, b.w, 1, lerpColor(b.roof, '#000', 0.4));
      } else {
        fillRect(ctx, b.x, b.y, b.w, 3, b.roof);
        fillRect(ctx, b.x - 1, b.y - 1, b.w + 2, 1, lerpColor(b.roof, '#000', 0.5));
      }

      // Rooftop water tank
      if (b.rooftop) {
        fillRect(ctx, b.x + 5, b.y - 5, 7, 5, b.shade);
        fillRect(ctx, b.x + 5, b.y - 6, 7, 1, lerpColor(b.shade, '#000', 0.4));
        fillRect(ctx, b.x + 6, b.y - 8, 5, 2, b.shade);
      }

      // Windows
      const flashing = flashedBldg === b && flashT > 0;
      for (const w of b.windows) {
        let on = flashing || w.lit;
        if (w.flicker && !flashing) on = (Math.sin(time * 2.3 + w.phase) > -0.4);
        // Frame
        fillRect(ctx, w.x - 1, w.y - 1, w.w + 2, w.h + 2, b.shade);
        // Pane
        const c = on ? w.color : COL.win_dim;
        fillRect(ctx, w.x, w.y, w.w, w.h, c);
        // Inner highlight
        if (on) fillRect(ctx, w.x, w.y, w.w, 1, lerpColor(c, '#fff', 0.25));
      }

      // Door at bottom (for taller buildings)
      if (b.h >= 80) {
        const doorW = 5, doorH = 7;
        const dx = b.x + Math.floor(b.w / 2) - Math.floor(doorW / 2);
        const dy = b.y + b.h - doorH;
        fillRect(ctx, dx - 1, dy - 1, doorW + 2, doorH + 1, b.shade);
        fillRect(ctx, dx, dy, doorW, doorH, COL.trim);
        // Door light glow
        pixel(ctx, dx + Math.floor(doorW / 2), dy - 2, COL.lamp_glow);
        ctx.globalAlpha = 0.4;
        fillRect(ctx, dx + Math.floor(doorW / 2) - 2, dy - 4, 5, 4, COL.lamp_glow);
        ctx.globalAlpha = 1;
      }
    }

    function drawTree(ctx, t) {
      const { x: cx, y: cy, r } = t;
      for (let dy = -r; dy <= r; dy++) {
        const w = r - Math.abs(dy);
        if (w < 0) continue;
        fillRect(ctx, cx - w, cy + dy, w * 2 + 1, 1, COL.tree);
      }
      pixel(ctx, cx, cy - r, COL.tree_d);
      pixel(ctx, cx + r - 1, cy, lerpColor(COL.tree, '#fff', 0.2));
    }

    function drawLamp(ctx, l) {
      fillRect(ctx, l.x, l.y - 12, 1, 12, COL.lamp_post);
      pixel(ctx, l.x, l.y - 13, COL.lamp_core);
      ctx.globalAlpha = 0.35;
      fillRect(ctx, l.x - 4, l.y - 16, 9, 8, COL.lamp_glow);
      ctx.globalAlpha = 0.18;
      fillRect(ctx, l.x - 7, l.y - 20, 15, 14, COL.lamp_glow);
      ctx.globalAlpha = 1;
    }

    function draw(ctx) {
      drawSky(ctx);
      drawStars(ctx);
      for (const c of clouds) drawCloud(ctx, c);
      for (const b of distantBuildings) drawDistantBuilding(ctx, b);
      for (const b of midBuildings) drawMidBuilding(ctx, b);
      for (const b of fgBuildings) drawFgBuilding(ctx, b);

      // Street
      fillRect(ctx, 0, 305, 180, 320 - 305, COL.street);
      fillRect(ctx, 0, 305, 180, 1, COL.sidewalk);

      for (const t of trees) drawTree(ctx, t);
      for (const l of lamps) drawLamp(ctx, l);
    }

    scene.start({ update, draw });
  })();
  </script>
</body>
