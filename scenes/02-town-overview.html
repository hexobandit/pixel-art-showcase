<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>02 · Town Overview</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body class="scene">
  <a class="back-link" href="../index.html">← gallery</a>
  <div class="scene-label">02 · town overview</div>
  <script src="../shared/engine.js"></script>
  <script>
  (function () {
    const scene = Pixel.createScene({ width: 180, height: 320 });
    const P = Pixel.PALETTE;
    const { fillRect, lerpColor, pixel } = Pixel;

    const COL = {
      grass:        '#5fa64a',
      grass_dark:   '#3e8948',
      grass_light:  '#7cc468',
      road:         '#3a4466',
      road_line:    '#fee761',
      road_edge:    '#262b44',
      sidewalk:     '#8b9bb4',
      sidewalk_d:   '#5a6988',
      rail_track:   '#c0cbdc',
      rail_sleeper: '#733e39',
      rail_bed:     '#5a6988',
      bush:         '#265c42',
      bush_high:    '#3e8948',

      bldg_red:     '#a74b3a',
      bldg_red_d:   '#733e39',
      bldg_blue:    '#5a7a92',
      bldg_blue_d:  '#3a4466',
      bldg_yellow:  '#d4a76a',
      bldg_yellow_d:'#8a6a3e',
      bldg_gray:    '#8b9bb4',
      bldg_gray_d:  '#5a6988',
      bldg_big:     '#6d8aa0',
      bldg_big_d:   '#3a5266',

      win_blue:     '#88b4c2',
      win_cream:    '#ead4aa',
      win_dark:     '#262b44',
      win_yellow:   '#fee761',

      roof_red:     '#a74b3a',
      roof_blue:    '#3a5266',
      roof_green:   '#3e8948',
      roof_brown:   '#733e39',
      roof_purple:  '#68386c',
      roof_orange:  '#b86f50',
      roof_teal:    '#265c42',
      roof_olive:   '#7a7a3e',
      roof_mauve:   '#9a5872',

      house_wall:   '#ead4aa',
      house_wall_d: '#c28569',
      door:         '#5a3a2e',

      car_red:      '#e43b44',
      car_blue:     '#0099db',
      car_yellow:   '#feae34',
      car_white:    '#c0cbdc',
      car_orange:   '#f77622',
      car_green:    '#63c74d',

      lamp_post:    '#3a4466',
      lamp_bulb:    '#fee761',
      cable:        '#5a3a2e',

      train_red:    '#be4a2f',
      train_yellow: '#d4a76a',
      train_blue:   '#5a7a92',
      train_dark:   '#262b44',

      smoke:        '#c0cbdc',
      smoke_d:      '#8b9bb4',
    };

    let time = 0;

    // ---------- Layout ----------
    const RAIL_H       = 11;
    const BLDG_BASE    = 122;
    const ROAD_Y       = 134;
    const ROAD_H       = 36;
    const SW_TOP_Y     = ROAD_Y;             // top sidewalk band
    const SW_BOT_Y     = ROAD_Y + ROAD_H - 5;
    const ROAD_SURF_Y  = ROAD_Y + 5;
    const ROAD_SURF_H  = ROAD_H - 10;
    const HOUSE_Y0     = 175;
    const HOUSE_W      = 32;
    const HOUSE_H      = 40;
    const HOUSE_ROW_GAP = 5;

    // ---------- Big buildings (top section) ----------
    const buildings = [
      { x: 4,   w: 28, h: 90,  color: COL.bldg_red,    shade: COL.bldg_red_d,    win: COL.win_yellow, antenna: 0 },
      { x: 36,  w: 24, h: 76,  color: COL.bldg_blue,   shade: COL.bldg_blue_d,   win: COL.win_blue,   antenna: 0 },
      { x: 64,  w: 36, h: 104, color: COL.bldg_big,    shade: COL.bldg_big_d,    win: COL.win_blue,   antenna: 4 },
      { x: 104, w: 24, h: 84,  color: COL.bldg_yellow, shade: COL.bldg_yellow_d, win: COL.win_cream,  antenna: 0 },
      { x: 132, w: 24, h: 80,  color: COL.bldg_gray,   shade: COL.bldg_gray_d,   win: COL.win_blue,   antenna: 0 },
    ];

    // ---------- Bushes ----------
    const bushes = [];
    function addBush(x, y, r) { bushes.push({ x, y, r }); }
    // Around big buildings (lawn strip below them)
    for (let i = 0; i < 12; i++) {
      const x = 6 + (i * 14 + ((i * 7) % 5)) % 170;
      const y = BLDG_BASE + 2 + ((i * 5) % 8);
      addBush(x, y, 1 + (i % 2));
    }
    // Below road (lawn strip above first house row)
    for (let i = 0; i < 8; i++) {
      const x = 4 + (i * 22 + ((i * 11) % 4));
      const y = ROAD_Y + ROAD_H + 1 + ((i * 3) % 3);
      addBush(x, y, 1);
    }

    // ---------- Houses ----------
    const houses = [];
    const roofRoster = [
      COL.roof_red, COL.roof_blue, COL.roof_green, COL.roof_brown,
      COL.roof_purple, COL.roof_red, COL.roof_orange, COL.roof_teal,
      COL.roof_blue, COL.roof_brown, COL.roof_olive, COL.roof_mauve,
    ];
    let roofIdx = 0;
    for (let row = 0; row < 3; row++) {
      const y = HOUSE_Y0 + row * (HOUSE_H + HOUSE_ROW_GAP);
      for (let col = 0; col < 4; col++) {
        const x = 8 + col * (HOUSE_W + 10);
        houses.push({
          x, y, w: HOUSE_W, h: HOUSE_H,
          roof: roofRoster[roofIdx % roofRoster.length],
          smokeParticles: [],
        });
        roofIdx++;
      }
    }

    // ---------- Power cables (vertical, dashed, between/over houses) ----------
    const cableXs = [3, 49, 91, 133, 178];

    // ---------- Lampposts ----------
    const topLampXs = [12, 56, 100, 144, 174];
    const botLampXs = [12, 56, 100, 144, 174];

    // ---------- Vehicles ----------
    const vehicles = [];
    function spawnVehicle(rightward) {
      const types = ['car', 'car', 'car', 'car', 'bus'];
      const type = types[Math.floor(Math.random() * types.length)];
      const colors = [COL.car_red, COL.car_blue, COL.car_yellow, COL.car_white, COL.car_orange, COL.car_green];
      vehicles.push({
        type,
        x: rightward ? -30 : 200,
        lane: rightward ? 0 : 1,
        speed: (rightward ? 1 : -1) * (14 + Math.random() * 8),
        color: colors[Math.floor(Math.random() * colors.length)],
        length: type === 'bus' ? 26 : 14,
        height: 7,
        honkT: 0,
      });
    }
    for (let i = 0; i < 4; i++) {
      spawnVehicle(Math.random() < 0.5);
      vehicles[vehicles.length - 1].x = Math.random() * 180;
    }
    function laneY(lane) { return ROAD_SURF_Y + 2 + lane * 13; }

    // ---------- Pedestrians ----------
    const peds = [];
    function spawnPed(topSidewalk) {
      const colors = ['#e43b44', '#0099db', '#feae34', '#3e8948', '#b55088', '#fee761', '#c0cbdc'];
      peds.push({
        x: Math.random() < 0.5 ? -4 : 184,
        y: topSidewalk ? SW_TOP_Y + 0 : SW_BOT_Y + 0,
        speed: (Math.random() < 0.5 ? 1 : -1) * (5 + Math.random() * 3),
        color: colors[Math.floor(Math.random() * colors.length)],
        walk: Math.random() * 10,
      });
      peds[peds.length - 1].speed = peds[peds.length - 1].x < 0
        ? Math.abs(peds[peds.length - 1].speed)
        : -Math.abs(peds[peds.length - 1].speed);
    }
    for (let i = 0; i < 5; i++) spawnPed(Math.random() < 0.5);

    // ---------- Cyclist ----------
    const cyclist = {
      x: -10,
      y: laneY(0) - 1,
      speed: 12,
      bobPhase: 0,
    };

    // ---------- Train ----------
    const trainCars = [
      { color: COL.train_red,    w: 30, isEngine: true },
      { color: COL.train_yellow, w: 26 },
      { color: COL.train_blue,   w: 26 },
      { color: COL.train_red,    w: 26 },
    ];
    const trainTotalLen = trainCars.reduce((s, c) => s + c.w + 1, 0);
    let trainActive = false;
    let trainX = -trainTotalLen - 10;
    let trainNext = 4;

    // ---------- Tap interaction ----------
    scene.onTap((x, y) => {
      // Houses → puff smoke from chimney
      for (const h of houses) {
        if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) {
          const cx = h.x + Math.floor(h.w * 0.72);
          const cy = h.y + Math.floor(h.h * 0.18);
          for (let i = 0; i < 6; i++) {
            h.smokeParticles.push({
              x: cx + (Math.random() - 0.5) * 1.5,
              y: cy,
              vx: (Math.random() - 0.5) * 5,
              vy: -(7 + Math.random() * 6),
              life: 0,
              maxLife: 1.4 + Math.random() * 0.8,
            });
          }
          return;
        }
      }
      // Vehicles → honk
      for (const v of vehicles) {
        if (x >= v.x && x <= v.x + v.length &&
            y >= laneY(v.lane) - 2 && y <= laneY(v.lane) + v.height + 2) {
          v.honkT = 0.6;
          return;
        }
      }
    });

    // ---------- Update ----------
    function update(dt) {
      time += dt;

      // Train
      if (trainActive) {
        trainX += 60 * dt;
        if (trainX > 200) {
          trainActive = false;
          trainNext = 8 + Math.random() * 14;
        }
      } else {
        trainNext -= dt;
        if (trainNext <= 0) {
          trainActive = true;
          trainX = -trainTotalLen - 6;
        }
      }

      // Vehicles
      for (let i = vehicles.length - 1; i >= 0; i--) {
        const v = vehicles[i];
        v.x += v.speed * dt;
        if (v.honkT > 0) v.honkT -= dt;
        if ((v.speed > 0 && v.x > 200) || (v.speed < 0 && v.x < -30)) vehicles.splice(i, 1);
      }
      while (vehicles.length < 5) spawnVehicle(Math.random() < 0.5);

      // Pedestrians
      for (let i = peds.length - 1; i >= 0; i--) {
        const p = peds[i];
        p.x += p.speed * dt;
        p.walk += Math.abs(p.speed) * dt;
        if ((p.speed > 0 && p.x > 184) || (p.speed < 0 && p.x < -4)) peds.splice(i, 1);
      }
      while (peds.length < 5) spawnPed(Math.random() < 0.5);

      // Cyclist (uses lower lane shoulder)
      cyclist.x += cyclist.speed * dt;
      cyclist.bobPhase += dt * 8;
      if (cyclist.x > 200) cyclist.x = -12;

      // Smoke particles
      for (const h of houses) {
        for (let i = h.smokeParticles.length - 1; i >= 0; i--) {
          const sp = h.smokeParticles[i];
          sp.life += dt;
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.vy *= 0.94;
          sp.vx *= 0.97;
          if (sp.life >= sp.maxLife) h.smokeParticles.splice(i, 1);
        }
      }
    }

    // ---------- Drawing ----------
    function drawGrass(ctx) {
      fillRect(ctx, 0, 0, 180, 320, COL.grass);
      // Pseudo-noise tufts (deterministic from coords)
      for (let y = 0; y < 320; y += 4) {
        for (let x = 0; x < 180; x += 6) {
          const k = (x * 73 + y * 41) % 100;
          if (k < 18) pixel(ctx, x + (k % 5), y + (k % 3), COL.grass_dark);
          else if (k > 86) pixel(ctx, x + (k % 4) + 1, y + (k % 3), COL.grass_light);
        }
      }
    }

    function drawRailway(ctx) {
      // gravel bed
      fillRect(ctx, 0, 0, 180, RAIL_H, COL.rail_bed);
      // sleepers
      for (let x = -1; x < 180; x += 4) {
        fillRect(ctx, x, 1, 2, RAIL_H - 2, COL.rail_sleeper);
      }
      // two parallel rails
      fillRect(ctx, 0, 3, 180, 1, COL.rail_track);
      fillRect(ctx, 0, RAIL_H - 4, 180, 1, COL.rail_track);
    }

    function drawTrain(ctx) {
      if (!trainActive) return;
      let cx = trainX;
      for (const car of trainCars) {
        // body
        fillRect(ctx, cx, 1, car.w, RAIL_H - 1, car.color);
        // top stripe
        fillRect(ctx, cx, 1, car.w, 1, lerpColor(car.color, '#000', 0.4));
        // bottom shade
        fillRect(ctx, cx, RAIL_H - 1, car.w, 1, lerpColor(car.color, '#000', 0.5));
        // windows
        for (let wx = cx + 3; wx + 2 < cx + car.w - 2; wx += 4) {
          fillRect(ctx, wx, 4, 2, 2, COL.win_blue);
        }
        if (car.isEngine) {
          // chimney puff
          pixel(ctx, cx + 2, 0, COL.smoke);
          pixel(ctx, cx + 1, 0, COL.smoke_d);
        }
        // coupler
        fillRect(ctx, cx + car.w, 5, 1, 2, COL.train_dark);
        cx += car.w + 1;
      }
    }

    function drawBuilding(ctx, b) {
      const top = BLDG_BASE - b.h;
      // ground shadow
      fillRect(ctx, b.x + 2, BLDG_BASE, b.w, 2, lerpColor(COL.grass, '#000', 0.3));
      fillRect(ctx, b.x + b.w, top + 4, 2, b.h - 2, lerpColor(COL.grass, '#000', 0.25));

      // body
      fillRect(ctx, b.x, top, b.w, b.h, b.color);
      // top roof band (darker — pseudo-3D)
      fillRect(ctx, b.x, top, b.w, 4, b.shade);
      fillRect(ctx, b.x, top, b.w, 1, lerpColor(b.shade, '#000', 0.3));

      // antenna
      if (b.antenna > 0) {
        const ax = b.x + Math.floor(b.w / 2);
        fillRect(ctx, ax, top - b.antenna, 1, b.antenna, b.shade);
        if (Math.floor(time * 1.5) % 2 === 0) pixel(ctx, ax, top - b.antenna, COL.car_red);
      }

      // bottom band (foundation/lobby)
      fillRect(ctx, b.x, BLDG_BASE - 6, b.w, 6, b.shade);
      // door (centered glass)
      const dx = b.x + Math.floor(b.w / 2) - 3;
      fillRect(ctx, dx, BLDG_BASE - 5, 6, 5, COL.win_cream);
      fillRect(ctx, dx + 2, BLDG_BASE - 5, 1, 5, b.shade);
      // door step
      fillRect(ctx, dx - 1, BLDG_BASE - 1, 8, 1, lerpColor(b.shade, '#000', 0.4));

      // window rows: each row is a horizontal band with individual lit windows
      const winY0 = top + 6;
      const winYN = BLDG_BASE - 8;
      const rowH = 6;
      const winColShade = lerpColor(b.color, '#000', 0.3);
      for (let wy = winY0; wy + 4 <= winYN; wy += rowH) {
        // dark band background
        fillRect(ctx, b.x + 2, wy, b.w - 4, 4, winColShade);
        // bottom highlight
        fillRect(ctx, b.x + 2, wy + 4, b.w - 4, 1, lerpColor(b.color, '#fff', 0.1));
        // windows
        for (let wx = b.x + 3; wx + 2 < b.x + b.w - 3; wx += 4) {
          fillRect(ctx, wx, wy + 1, 3, 3, b.win);
          // window split
          pixel(ctx, wx + 1, wy + 1, lerpColor(b.win, '#000', 0.3));
        }
      }
    }

    function drawBush(ctx, bs) {
      const cx = bs.x, cy = bs.y, r = bs.r;
      for (let dy = -r; dy <= r; dy++) {
        const w = r - Math.abs(dy);
        if (w < 0) continue;
        fillRect(ctx, Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1, COL.bush);
      }
      pixel(ctx, Math.round(cx), Math.round(cy - r), COL.bush_high);
      if (r >= 2) pixel(ctx, Math.round(cx + 1), Math.round(cy), COL.bush_high);
    }

    function drawRoad(ctx) {
      // sidewalks (top + bottom)
      fillRect(ctx, 0, SW_TOP_Y, 180, 5, COL.sidewalk);
      fillRect(ctx, 0, SW_BOT_Y, 180, 5, COL.sidewalk);
      // sidewalk edge shading
      fillRect(ctx, 0, SW_TOP_Y, 180, 1, COL.sidewalk_d);
      fillRect(ctx, 0, SW_BOT_Y + 4, 180, 1, COL.sidewalk_d);
      // sidewalk seams
      for (let x = 0; x < 180; x += 10) {
        pixel(ctx, x, SW_TOP_Y + 2, COL.sidewalk_d);
        pixel(ctx, x, SW_BOT_Y + 2, COL.sidewalk_d);
      }
      // road surface
      fillRect(ctx, 0, ROAD_SURF_Y, 180, ROAD_SURF_H, COL.road);
      // edges
      fillRect(ctx, 0, ROAD_SURF_Y, 180, 1, COL.road_edge);
      fillRect(ctx, 0, ROAD_SURF_Y + ROAD_SURF_H - 1, 180, 1, COL.road_edge);
      // center dashes (yellow)
      for (let lx = 0; lx < 180; lx += 12) {
        fillRect(ctx, lx, ROAD_SURF_Y + Math.floor(ROAD_SURF_H / 2), 7, 1, COL.road_line);
      }
      // crosswalk at x=46 and x=128
      for (const cwX of [42, 128]) {
        for (let dy = 1; dy < ROAD_SURF_H - 1; dy += 2) {
          fillRect(ctx, cwX, ROAD_SURF_Y + dy, 4, 1, '#ead4aa');
        }
      }
    }

    function drawLampposts(ctx) {
      for (const lx of topLampXs) {
        fillRect(ctx, lx, SW_TOP_Y - 1, 1, 1, COL.lamp_post);
        pixel(ctx, lx, SW_TOP_Y - 2, COL.lamp_bulb);
      }
      for (const lx of botLampXs) {
        fillRect(ctx, lx, SW_BOT_Y + 5, 1, 1, COL.lamp_post);
        pixel(ctx, lx, SW_BOT_Y + 6, COL.lamp_bulb);
      }
    }

    function drawVehicle(ctx, v) {
      const y = laneY(v.lane);
      // shadow
      fillRect(ctx, v.x + 1, y + v.height, v.length, 1, lerpColor(COL.road, '#000', 0.4));
      // body
      fillRect(ctx, v.x, y, v.length, v.height, v.color);
      // body highlight on top
      fillRect(ctx, v.x + 1, y, v.length - 2, 1, lerpColor(v.color, '#fff', 0.2));
      // body shade on bottom
      fillRect(ctx, v.x + 1, y + v.height - 1, v.length - 2, 1, lerpColor(v.color, '#000', 0.25));
      // windows
      if (v.type === 'bus') {
        for (let wx = v.x + 2; wx + 2 < v.x + v.length - 2; wx += 3) {
          fillRect(ctx, wx, y + 1, 2, 3, COL.win_blue);
        }
        // bus stripe
        fillRect(ctx, v.x + 1, y + 4, v.length - 2, 1, lerpColor(v.color, '#000', 0.4));
      } else {
        // car: windshield front + rear window
        fillRect(ctx, v.x + 2, y + 1, 3, 3, COL.win_blue);
        fillRect(ctx, v.x + v.length - 5, y + 1, 3, 3, COL.win_blue);
      }
      // headlights/taillights — direction-aware
      const fx = v.speed > 0 ? v.x + v.length - 1 : v.x;
      const bx = v.speed > 0 ? v.x : v.x + v.length - 1;
      pixel(ctx, fx, y + 2, COL.win_yellow);
      pixel(ctx, fx, y + v.height - 3, COL.win_yellow);
      pixel(ctx, bx, y + 2, '#a22633');
      pixel(ctx, bx, y + v.height - 3, '#a22633');

      // honk indicator
      if (v.honkT > 0) {
        const a = v.honkT / 0.6;
        ctx.globalAlpha = a;
        const cx = v.x + Math.floor(v.length / 2);
        pixel(ctx, cx, y - 3, COL.car_yellow);
        pixel(ctx, cx - 1, y - 4, COL.car_yellow);
        pixel(ctx, cx + 1, y - 4, COL.car_yellow);
        pixel(ctx, cx - 2, y - 5, COL.car_yellow);
        pixel(ctx, cx + 2, y - 5, COL.car_yellow);
        ctx.globalAlpha = 1;
      }
    }

    function drawPed(ctx, p) {
      const x = Math.floor(p.x);
      const y = Math.floor(p.y);
      const wob = Math.floor(p.walk * 4) % 2;
      // head
      pixel(ctx, x + 1, y, '#3e2731');
      // body (shirt color)
      fillRect(ctx, x, y + 1, 3, 1, p.color);
      // legs (pants alternating)
      pixel(ctx, x + (wob ? 0 : 2), y + 2, '#3a4466');
      pixel(ctx, x + 1, y + 2, '#3a4466');
    }

    function drawCyclist(ctx, c) {
      const x = Math.floor(c.x);
      const y = Math.floor(c.y);
      // wheels (front + back)
      pixel(ctx, x, y + 3, COL.train_dark);
      pixel(ctx, x + 5, y + 3, COL.train_dark);
      // frame
      fillRect(ctx, x + 1, y + 3, 4, 1, COL.train_dark);
      // rider (body + head)
      pixel(ctx, x + 2, y, '#3e2731');     // helmet/head
      fillRect(ctx, x + 2, y + 1, 2, 2, COL.car_red);
    }

    function drawCables(ctx) {
      for (const cx of cableXs) {
        // From road area down to bottom
        for (let y = ROAD_Y + ROAD_H + 2; y < 320; y += 3) {
          pixel(ctx, cx, y, COL.cable);
        }
      }
    }

    function drawHouse(ctx, h) {
      const cx = h.x, cy = h.y, w = h.w, ht = h.h;
      // shadow
      fillRect(ctx, cx + 2, cy + ht, w, 2, lerpColor(COL.grass, '#000', 0.35));
      fillRect(ctx, cx + w, cy + 2, 2, ht, lerpColor(COL.grass, '#000', 0.3));

      // roof main color
      const roof = h.roof;
      const roofShade = lerpColor(roof, '#000', 0.3);
      const roofHigh  = lerpColor(roof, '#fff', 0.18);
      const roofH = Math.floor(ht * 0.62);

      // main roof rectangle
      fillRect(ctx, cx, cy, w, roofH, roof);
      // top/bottom edges
      fillRect(ctx, cx, cy, w, 1, roofShade);
      fillRect(ctx, cx, cy + roofH - 1, w, 1, roofShade);
      // right side shadow
      fillRect(ctx, cx + w - 1, cy, 1, roofH, roofShade);
      // left highlight
      fillRect(ctx, cx, cy + 1, 1, roofH - 2, roofHigh);
      // peak ridge (horizontal lighter line through middle)
      const peakY = cy + Math.floor(roofH * 0.45);
      fillRect(ctx, cx + 1, peakY, w - 2, 1, roofHigh);
      fillRect(ctx, cx + 1, peakY + 1, w - 2, 1, roof);

      // chimney
      const chx = cx + Math.floor(w * 0.7);
      const chy = cy + Math.floor(roofH * 0.18);
      fillRect(ctx, chx, chy - 3, 2, 4, roofShade);
      pixel(ctx, chx, chy - 4, COL.train_dark);

      // facade (front wall)
      const facadeY = cy + roofH;
      const facadeH = ht - roofH;
      fillRect(ctx, cx, facadeY, w, facadeH, COL.house_wall);
      // top trim
      fillRect(ctx, cx, facadeY, w, 1, COL.house_wall_d);
      // bottom foundation
      fillRect(ctx, cx, cy + ht - 1, w, 1, lerpColor(COL.house_wall, '#000', 0.4));

      // door (centered)
      const doorW = 5, doorH = facadeH - 2;
      const doorX = cx + Math.floor(w / 2) - 2;
      const doorY = facadeY + 2;
      fillRect(ctx, doorX, doorY, doorW, doorH, COL.door);
      pixel(ctx, doorX, doorY, lerpColor(COL.door, '#000', 0.4));
      pixel(ctx, doorX + doorW - 1, doorY, lerpColor(COL.door, '#000', 0.4));
      pixel(ctx, doorX + doorW - 2, doorY + Math.floor(doorH / 2), COL.win_yellow); // knob

      // windows (left and right of door)
      const winW = 6, winH = 4;
      // left window
      fillRect(ctx, cx + 3, facadeY + 3, winW, winH, COL.win_blue);
      fillRect(ctx, cx + 3, facadeY + 3, winW, 1, COL.win_dark);
      pixel(ctx, cx + 3 + Math.floor(winW / 2), facadeY + 3, COL.win_dark);
      pixel(ctx, cx + 3, facadeY + 3 + Math.floor(winH / 2), COL.win_dark);
      // right window
      const rwX = cx + w - 3 - winW;
      fillRect(ctx, rwX, facadeY + 3, winW, winH, COL.win_blue);
      fillRect(ctx, rwX, facadeY + 3, winW, 1, COL.win_dark);
      pixel(ctx, rwX + Math.floor(winW / 2), facadeY + 3, COL.win_dark);
      pixel(ctx, rwX, facadeY + 3 + Math.floor(winH / 2), COL.win_dark);

      // smoke particles
      for (const sp of h.smokeParticles) {
        const t = sp.life / sp.maxLife;
        ctx.globalAlpha = (1 - t);
        const c = t < 0.4 ? COL.smoke : COL.smoke_d;
        pixel(ctx, Math.floor(sp.x), Math.floor(sp.y), c);
        if (t < 0.5) pixel(ctx, Math.floor(sp.x + 1), Math.floor(sp.y), c);
        ctx.globalAlpha = 1;
      }
    }

    function draw(ctx) {
      drawGrass(ctx);

      // upper bushes (ones near big building base) — drawn behind buildings
      for (const bs of bushes) {
        if (bs.y < BLDG_BASE + 6) drawBush(ctx, bs);
      }

      // buildings
      for (const b of buildings) drawBuilding(ctx, b);

      // bushes nearer the road
      for (const bs of bushes) {
        if (bs.y >= BLDG_BASE + 6 && bs.y < ROAD_Y) drawBush(ctx, bs);
      }

      // railway + train at top
      drawRailway(ctx);
      drawTrain(ctx);

      // road
      drawRoad(ctx);
      drawLampposts(ctx);

      // bushes between road and houses
      for (const bs of bushes) {
        if (bs.y >= ROAD_Y + ROAD_H) drawBush(ctx, bs);
      }

      // vehicles
      for (const v of vehicles) drawVehicle(ctx, v);

      // pedestrians + cyclist
      for (const p of peds) drawPed(ctx, p);
      drawCyclist(ctx, cyclist);

      // power cables (over residential)
      drawCables(ctx);

      // houses (top to bottom so lower rows overlap upper shadows correctly)
      for (const h of houses) drawHouse(ctx, h);
    }

    scene.start({ update, draw });
  })();
  </script>
