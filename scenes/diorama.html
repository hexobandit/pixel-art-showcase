<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ananke — Diorama</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: #14181d;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #6ba566;
    box-shadow: 0 8px 48px rgba(0,0,0,0.55);
    touch-action: none;
  }
  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    color: #e8e3d6; font: 11px/1.4 'Courier New', monospace;
    letter-spacing: 0.18em; text-transform: lowercase;
    pointer-events: none; opacity: 0.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag from a stop, through stops, to draw a bus route</div>
<script>
'use strict';

// ============================================================
// Ananke Diorama — pixel-art bus city.
// Grid of streets with stops at intersections.
// Drag finger from stop to stop to draw a bus route.
// ============================================================

const W = 200, H = 300;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.max(1, Math.min(vw / W, vh / H));
  const si = Math.max(1, Math.floor(s));
  const scale = (s - si) > 0.5 ? si + 1 : si;
  cv.style.width  = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
}
fit();
addEventListener('resize', fit);

// -------- RNG --------
let _seed = 91827364;
function rng() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 0x100000000; }
function rand(a, b) { return a + rng() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b)); }
function pick(arr) { return arr[randi(0, arr.length)]; }

// -------- Palettes --------
const C = {
  grass:'#6ba566', grassD:'#508a4f', grassL:'#86bc7a', grassXD:'#3e6e44',
  dirt:'#8a7050', shadow:'rgba(20,30,20,0.32)',
  road:'#494951', roadD:'#3a3a40', laneM:'#e8c660', curb:'#7c7c75',
  walk:'#b8b8ae', walkD:'#959589',
  rail:'#a0a098', railD:'#5e5e58', sleeper:'#5a3d28', ballast:'#7c6c5a',
  trunk:'#382418', treeM:'#3a6b48', treeD:'#244830', treeL:'#5a8c5a', treeH:'#82b078',
  pedSkin:'#f0c89c', pedFeet:'#2a1c14',
  signPole:'#3a3a40', signRed:'#d8443e',
  carWin:'#9cc0d0', busWin:'#aacfdc',
  trainR:'#c44848', trainRD:'#822e2e', trainY:'#e8c660',
  stopBase:'#f4eed0', stopRing:'#1a1a22', stopShadow:'#a8a290',
};

const HOUSE_PAL = [
  ['#d49080','#a86256','#6c3830','#955048','#5d2c2c','#3a1a1a','#cdd8c0','#3a261c'],
  ['#88a8c4','#5a7e9c','#36506c','#3e5a72','#283e54','#16243a','#cfddde','#221610'],
  ['#9fc095','#6e9568','#42663d','#4c6850','#2e4434','#1a2a1f','#d2dcc4','#22160e'],
  ['#e0c280','#a88a52','#6e552a','#825a30','#56391e','#321f10','#dad8be','#3a261c'],
  ['#d8c8a8','#a89472','#6c5a44','#623a2e','#3a1f1a','#22130f','#bdd0d0','#1c0e08'],
  ['#c896b0','#956a82','#5e3e54','#5a3a52','#341e30','#1f0f1c','#d0d0c0','#221416'],
];

const OFFICE_PAL = [
  ['#b8705c','#86493a','#522820','#382820','#241612','#e8d690','#ac9e60','#dccb96'],
  ['#aeb0b8','#7a7a84','#46464e','#3a3a40','#22222a','#6498b8','#3e6080','#dad8be'],
  ['#9eb6cc','#647e9a','#3e5267','#42566e','#28384a','#86c0dc','#476890','#e8e8d0'],
  ['#dcb670','#a08652','#6a522e','#3a3024','#22180e','#e6c660','#a48c46','#e0d2a4'],
];

const PED_SHIRTS = [
  '#e85f5f','#5a8fc5','#7bab7b','#d2a05a','#a26ec2','#e0d098',
  '#3a8fbc','#bc4a4a','#88b070','#d8804a','#c4c4c4','#5a4a8c'
];

const ROUTE_COLORS = ['#e8804a','#5a8fc5','#7bab7b','#c47ad8'];
const ROUTE_DARK   = ['#a8542c','#345070','#4a6e4a','#7c5090'];

// -------- Layout (grid) --------
const TRAIN_RAIL_Y = 14;
const TRAIN_TOP = 11;
const TRAIN_BOT = 18;

// Road centerlines and extents
const ROAD_HW = 4;        // half-width of asphalt
const SW_W = 2;           // sidewalk strip thickness (just outside asphalt)

const HROADS = [
  { y: 100, x0: 0, x1: W },
  { y: 210, x0: 0, x1: W },
];
const VROADS = [
  { x: 50,  y0: 100, y1: 210 },
  { x: 150, y0: 100, y1: 210 },
];

// Network nodes (= bus stops). Each one sits at an intersection or road endpoint.
const NODES = [
  { id: 0, x: 10,  y: 100 }, // A west end
  { id: 1, x: 50,  y: 100 }, // A × V1
  { id: 2, x: 150, y: 100 }, // A × V2
  { id: 3, x: 190, y: 100 }, // A east end
  { id: 4, x: 10,  y: 210 }, // B west end
  { id: 5, x: 50,  y: 210 }, // B × V1
  { id: 6, x: 150, y: 210 }, // B × V2
  { id: 7, x: 190, y: 210 }, // B east end
];
const EDGES = [
  [0,1],[1,2],[2,3],
  [4,5],[5,6],[6,7],
  [1,5],[2,6],
];
const NEIGHBORS = NODES.map(_ => []);
for (const [a,b] of EDGES) { NEIGHBORS[a].push(b); NEIGHBORS[b].push(a); }

// Train stations
const TRAIN_STATIONS = [
  { x: 14,  y: 22, w: 26, h: 10 },
  { x: 162, y: 22, w: 24, h: 10 },
];

// -------- Buildings --------
// Cells: split by vertical roads into 3 columns.
const CELLS = [
  { x0: 4,   x1: 44  },   // left of V1
  { x0: 56,  x1: 144 },   // between V1 and V2
  { x0: 156, x1: 196 },   // right of V2
];

const HOUSES = [];
{
  // Middle band rows: between Road A (y=100) and Road B (y=210).
  // Sidewalks of road A end at y=100+ROAD_HW+SW_W = 106. So houses start ~y=110.
  const midRows = [
    { y: 113, h: 22 },
    { y: 142, h: 22 },
    { y: 171, h: 24 },
  ];
  let idx = 0;
  for (const row of midRows) {
    for (const cell of CELLS) {
      let x = cell.x0 + 1;
      while (x < cell.x1 - 14) {
        const ww = 14 + (idx % 3) * 3;
        if (x + ww > cell.x1 - 1) break;
        HOUSES.push({
          x, y: row.y, w: ww, h: row.h,
          pal: HOUSE_PAL[(idx + cell.x0) % HOUSE_PAL.length],
          v: idx % 4,
        });
        x += ww + 3;
        idx++;
      }
    }
  }
  // South band rows: below Road B (y=210), above bottom forest
  const sRows = [
    { y: 224, h: 22 },
    { y: 252, h: 22 },
  ];
  for (const row of sRows) {
    for (const cell of CELLS) {
      let x = cell.x0 + 1;
      while (x < cell.x1 - 14) {
        const ww = 14 + (idx % 3) * 3;
        if (x + ww > cell.x1 - 1) break;
        HOUSES.push({
          x, y: row.y, w: ww, h: row.h,
          pal: HOUSE_PAL[(idx + cell.x0) % HOUSE_PAL.length],
          v: idx % 4,
        });
        x += ww + 3;
        idx++;
      }
    }
  }
}

const OFFICES = [
  { x: 8,   y: 42, w: 32, h: 50, pal: OFFICE_PAL[0], v: 0 },
  { x: 58,  y: 38, w: 38, h: 54, pal: OFFICE_PAL[2], v: 2 },
  { x: 102, y: 44, w: 40, h: 48, pal: OFFICE_PAL[3], v: 0 },
  { x: 158, y: 40, w: 32, h: 52, pal: OFFICE_PAL[1], v: 1 },
];

// -------- Trees & static noise --------
const grassNoise = [];
for (let i = 0; i < 1500; i++) grassNoise.push({ x: randi(0, W), y: randi(0, H), kind: rng() });

const TREES = [];
{
  // Top forest band
  for (let x = 0; x < W; x += randi(5, 9)) TREES.push({ x: x + randi(-1, 2), y: randi(2, 9), s: randi(1, 4) });
  // Below train, above offices
  for (let i = 0; i < 14; i++) TREES.push({ x: randi(2, W-2), y: randi(33, 38), s: randi(1, 3) });
  // Park strip just above Road A (between offices and road)
  for (let i = 0; i < 6; i++) TREES.push({ x: randi(4, W-4), y: randi(95, 96), s: 1 });
  // Park strip below Road A (between road and middle houses)
  for (let i = 0; i < 5; i++) TREES.push({ x: randi(4, W-4), y: randi(108, 111), s: 1 });
  // Park strip above Road B
  for (let i = 0; i < 5; i++) TREES.push({ x: randi(4, W-4), y: randi(199, 203), s: randi(1, 2) });
  // Park strip below Road B
  for (let i = 0; i < 5; i++) TREES.push({ x: randi(4, W-4), y: randi(217, 221), s: randi(1, 2) });
  // Below south houses
  for (let i = 0; i < 6; i++) TREES.push({ x: randi(4, W-4), y: randi(279, 284), s: randi(1, 2) });
  // Bottom forest
  for (let x = 0; x < W; x += randi(5, 9)) TREES.push({ x: x + randi(-1, 2), y: randi(285, 297), s: randi(1, 4) });
}

// -------- Drawing primitives --------
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x|0, y|0, 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x|0, y|0, w|0, h|0); }
function hline(x, y, w, c) { rect(x, y, w, 1, c); }
function vline(x, y, h, c) { rect(x, y, 1, h, c); }

// -------- Ground --------
function drawGround() {
  rect(0, 0, W, H, C.grass);
  for (let i = 0; i < grassNoise.length; i++) {
    const n = grassNoise[i];
    if (n.kind < 0.42) px(n.x, n.y, C.grassD);
    else if (n.kind < 0.76) px(n.x, n.y, C.grassL);
    else if (n.kind < 0.92) px(n.x, n.y, C.grassXD);
  }
  // Faint dirt patches in park strips
  for (let i = 0; i < 30; i++) {
    px(randi(8, 192), randi(108, 112), C.dirt);
    px(randi(8, 192), randi(217, 221), C.dirt);
  }
}

function drawTreeAt(cx, cy, s) {
  if (s === 1) {
    rect(cx, cy + 1, 2, 1, C.shadow);
    rect(cx - 1, cy - 1, 3, 2, C.treeM);
    px(cx, cy - 2, C.treeL);
    px(cx + 1, cy - 1, C.treeD);
    px(cx - 1, cy, C.treeD);
  } else if (s === 2) {
    rect(cx - 1, cy + 1, 4, 1, C.shadow);
    rect(cx - 2, cy - 1, 5, 2, C.treeM);
    rect(cx - 1, cy - 3, 4, 2, C.treeM);
    px(cx, cy - 4, C.treeL);
    px(cx - 1, cy - 2, C.treeL);
    px(cx + 1, cy - 3, C.treeH);
    px(cx + 2, cy - 1, C.treeD);
    px(cx + 2, cy, C.treeD);
    px(cx - 2, cy, C.treeD);
  } else {
    rect(cx - 2, cy + 1, 6, 1, C.shadow);
    rect(cx - 3, cy - 1, 7, 2, C.treeM);
    rect(cx - 2, cy - 3, 6, 2, C.treeM);
    rect(cx - 1, cy - 5, 4, 2, C.treeM);
    px(cx, cy - 6, C.treeL);
    px(cx + 1, cy - 6, C.treeL);
    px(cx - 1, cy - 4, C.treeH);
    px(cx + 1, cy - 5, C.treeH);
    px(cx + 2, cy - 3, C.treeD);
    px(cx + 3, cy - 1, C.treeD);
    px(cx + 3, cy, C.treeD);
    px(cx - 3, cy, C.treeD);
    px(cx - 2, cy - 2, C.treeD);
  }
}
function drawTrees() {
  const sorted = TREES.slice().sort((a, b) => a.y - b.y);
  for (const t of sorted) drawTreeAt(t.x, t.y, t.s);
}

// -------- Train track + stations --------
function drawTrack() {
  rect(0, TRAIN_TOP - 1, W, TRAIN_BOT - TRAIN_TOP + 2, C.ballast);
  for (let x = 0; x < W; x += 5) rect(x, TRAIN_TOP, 4, TRAIN_BOT - TRAIN_TOP + 1, C.sleeper);
  hline(0, TRAIN_RAIL_Y - 1, W, C.railD);
  hline(0, TRAIN_RAIL_Y, W, C.rail);
  hline(0, TRAIN_RAIL_Y + 2, W, C.railD);
  hline(0, TRAIN_RAIL_Y + 3, W, C.rail);
}

function drawTrainStations() {
  for (const s of TRAIN_STATIONS) {
    rect(s.x + 1, s.y + s.h, s.w, 1, C.shadow);
    rect(s.x + s.w, s.y + 1, 1, s.h, C.shadow);
    rect(s.x, s.y, s.w, s.h, '#bcb6a4');
    hline(s.x, s.y, s.w, '#94907e');
    hline(s.x, s.y + 1, s.w, '#d8d2c0');
    hline(s.x, s.y + s.h - 1, s.w, '#e6c660');
    for (let dx = 2; dx < s.w; dx += 3) px(s.x + dx, s.y + 2, '#94907e');
    rect(s.x + 1, s.y - 2, s.w - 2, 2, '#3a3a40');
    hline(s.x + 1, s.y - 2, s.w - 2, '#22222a');
    vline(s.x + 2, s.y - 1, 2, '#22222a');
    vline(s.x + s.w - 3, s.y - 1, 2, '#22222a');
    const sx = s.x + Math.floor(s.w / 2) - 4;
    rect(sx, s.y - 3, 8, 1, '#c44848');
    px(sx + 3, s.y - 3, '#f4d8a6');
    px(sx + 4, s.y - 3, '#f4d8a6');
  }
}

// -------- Roads grid --------
function drawAsphalt() {
  for (const r of HROADS) rect(r.x0, r.y - ROAD_HW, r.x1 - r.x0, ROAD_HW * 2 + 1, C.road);
  for (const r of VROADS) rect(r.x - ROAD_HW, r.y0, ROAD_HW * 2 + 1, r.y1 - r.y0, C.road);
  // Speckle on asphalt
  for (let i = 0; i < 220; i++) {
    const r = HROADS[i % HROADS.length];
    px(randi(r.x0, r.x1), r.y + randi(-ROAD_HW, ROAD_HW + 1), C.roadD);
  }
  for (let i = 0; i < 100; i++) {
    const r = VROADS[i % VROADS.length];
    px(r.x + randi(-ROAD_HW, ROAD_HW + 1), randi(r.y0, r.y1), C.roadD);
  }
}

function inAsphalt(x, y) {
  for (const r of HROADS) if (Math.abs(y - r.y) <= ROAD_HW && x >= r.x0 && x <= r.x1) return true;
  for (const r of VROADS) if (Math.abs(x - r.x) <= ROAD_HW && y >= r.y0 && y <= r.y1) return true;
  return false;
}

function drawSidewalks() {
  // Horizontal road sidewalks (split where vertical asphalt crosses)
  for (const r of HROADS) {
    const breaks = [];
    for (const v of VROADS) {
      if (v.y0 - ROAD_HW <= r.y && v.y1 + ROAD_HW >= r.y) {
        breaks.push([v.x - ROAD_HW, v.x + ROAD_HW]);
      }
    }
    breaks.sort((a, b) => a[0] - b[0]);
    let cur = r.x0;
    const seg = (x0, x1) => {
      const w = x1 - x0;
      if (w <= 0) return;
      // North strip
      rect(x0, r.y - ROAD_HW - 2, w, 1, C.walk);
      rect(x0, r.y - ROAD_HW - 1, w, 1, C.walkD);
      // South strip
      rect(x0, r.y + ROAD_HW + 1, w, 1, C.walkD);
      rect(x0, r.y + ROAD_HW + 2, w, 1, C.walk);
    };
    for (const [bs, be] of breaks) {
      if (bs > cur) seg(cur, bs);
      cur = Math.max(cur, be + 1);
    }
    if (cur < r.x1) seg(cur, r.x1);
  }
  // Vertical road sidewalks
  for (const r of VROADS) {
    const breaks = [];
    for (const h of HROADS) {
      if (h.x0 <= r.x && h.x1 >= r.x) breaks.push([h.y - ROAD_HW, h.y + ROAD_HW]);
    }
    breaks.sort((a, b) => a[0] - b[0]);
    let cur = r.y0;
    const seg = (y0, y1) => {
      const hh = y1 - y0;
      if (hh <= 0) return;
      rect(r.x - ROAD_HW - 2, y0, 1, hh, C.walk);
      rect(r.x - ROAD_HW - 1, y0, 1, hh, C.walkD);
      rect(r.x + ROAD_HW + 1, y0, 1, hh, C.walkD);
      rect(r.x + ROAD_HW + 2, y0, 1, hh, C.walk);
    };
    for (const [bs, be] of breaks) {
      if (bs > cur) seg(cur, bs);
      cur = Math.max(cur, be + 1);
    }
    if (cur < r.y1) seg(cur, r.y1);
  }
}

function drawLaneMarkings() {
  // Horizontal lanes — break at vertical-road intersections
  for (const r of HROADS) {
    const breaks = [];
    for (const v of VROADS) {
      if (v.y0 - ROAD_HW <= r.y && v.y1 + ROAD_HW >= r.y) breaks.push(v.x);
    }
    for (let xx = r.x0 + 4; xx < r.x1 - 2; xx += 8) {
      let skip = false;
      for (const b of breaks) if (Math.abs(xx + 2 - b) < ROAD_HW + 2) { skip = true; break; }
      if (!skip) rect(xx, r.y, 4, 1, C.laneM);
    }
  }
  // Vertical lanes — break at horizontal-road intersections
  for (const r of VROADS) {
    const breaks = [];
    for (const h of HROADS) {
      if (h.x0 <= r.x && h.x1 >= r.x) breaks.push(h.y);
    }
    for (let yy = r.y0 + 4; yy < r.y1 - 2; yy += 8) {
      let skip = false;
      for (const b of breaks) if (Math.abs(yy + 2 - b) < ROAD_HW + 2) { skip = true; break; }
      if (!skip) rect(r.x, yy, 1, 4, C.laneM);
    }
  }
}

// -------- Stops at network nodes --------
function drawStops() {
  for (const n of NODES) drawStopMarker(n.x, n.y);
}

function drawStopMarker(x, y) {
  // 7x7 light platform centered on the node, dark ring outline
  rect(x - 3, y - 3, 7, 7, C.stopBase);
  rect(x - 3, y - 3, 7, 1, C.stopRing);
  rect(x - 3, y + 3, 7, 1, C.stopRing);
  vline(x - 3, y - 3, 7, C.stopRing);
  vline(x + 3, y - 3, 7, C.stopRing);
  // Inner shadow strip on bottom-right
  hline(x - 2, y + 2, 5, C.stopShadow);
  vline(x + 2, y - 2, 5, C.stopShadow);
  // Tiny sign on a pole sticking up
  vline(x, y - 6, 4, C.signPole);
  rect(x, y - 7, 3, 2, C.signRed);
  px(x + 1, y - 7, '#f4d8a6');
}

// -------- Houses --------
function drawHouse(h) {
  const [wallL, wall, wallS, roofL, roof, roofS, win, door] = h.pal;
  rect(h.x + 2, h.y + h.h, h.w, 1, C.shadow);
  rect(h.x + h.w, h.y + 2, 1, h.h - 1, C.shadow);
  const wallH = 6;
  const roofH = h.h - wallH;
  rect(h.x, h.y + roofH, h.w, wallH, wall);
  vline(h.x, h.y + roofH, wallH, wallL);
  vline(h.x + h.w - 1, h.y + roofH, wallH, wallS);
  hline(h.x, h.y + h.h - 1, h.w, wallS);
  hline(h.x, h.y + h.h - 2, h.w, wallS);
  const dw = 2, dh = wallH - 2;
  const dx = h.x + Math.floor(h.w * (0.35 + (h.v % 3) * 0.12));
  rect(dx, h.y + roofH + 2, dw, dh, door);
  px(dx + dw, h.y + roofH + 2, wallS);
  if (h.w >= 12) {
    const wy = h.y + roofH + 2;
    rect(h.x + 2, wy, 2, 2, win);
    px(h.x + 2, wy + 2, wallS);
    px(h.x + 4, wy, wallS);
    rect(h.x + h.w - 5, wy, 2, 2, win);
    px(h.x + h.w - 5, wy + 2, wallS);
    px(h.x + h.w - 3, wy, wallS);
  }
  for (let dy = 0; dy < roofH; dy++) {
    const isTop = dy < Math.floor(roofH / 2);
    const c = isTop ? roofL : roof;
    rect(h.x - 1, h.y + dy, h.w + 2, 1, c);
  }
  hline(h.x - 1, h.y + roofH - 1, h.w + 2, roofS);
  hline(h.x, h.y + Math.floor(roofH / 2) - 1, h.w, roofL);
  hline(h.x, h.y + Math.floor(roofH / 2), h.w, roof);
  px(h.x - 1, h.y + roofH - 1, roofS);
  px(h.x + h.w, h.y + roofH - 1, roofS);
  hline(h.x, h.y, h.w, roofS);
  if (h.v >= 1 && h.w >= 14) {
    const cx = h.x + Math.floor(h.w * 0.7);
    rect(cx, h.y - 2, 2, 3, wallS);
    hline(cx, h.y - 3, 2, '#28201a');
  }
}
function drawHouses() {

}

// -------- Offices --------
function drawOffice(o) {
  const [wallL, wall, wallS, roof, roofD, win, winD, accent] = o.pal;
  rect(o.x + 2, o.y + o.h, o.w, 1, C.shadow);
  rect(o.x + o.w, o.y + 2, 1, o.h - 1, C.shadow);
  const roofH = 4;
  rect(o.x, o.y, o.w, roofH, roofD);
  rect(o.x + 1, o.y + 1, o.w - 2, 2, roof);
  rect(o.x, o.y + roofH, o.w, o.h - roofH, wall);
  vline(o.x, o.y + roofH, o.h - roofH, wallL);
  vline(o.x + o.w - 1, o.y + roofH, o.h - roofH, wallS);
  hline(o.x, o.y + o.h - 1, o.w, wallS);
  hline(o.x, o.y + o.h - 2, o.w, wallS);
  if (o.v === 0) {
    for (let cy = o.y + roofH + 4; cy < o.y + o.h - 3; cy += 6) {
      hline(o.x + 1, cy, o.w - 2, accent);
      hline(o.x + 1, cy + 1, o.w - 2, wallS);
    }
    for (let cy = o.y + roofH + 6; cy < o.y + o.h - 6; cy += 6) {
      for (let cx = o.x + 3; cx < o.x + o.w - 4; cx += 5) {
        rect(cx, cy, 2, 2, win);
        px(cx + 1, cy + 1, winD);
      }
    }
    const dw = 6, dx = o.x + Math.floor(o.w / 2) - dw / 2;
    rect(dx, o.y + o.h - 7, dw, 5, wallS);
    rect(dx + 1, o.y + o.h - 6, dw - 2, 3, accent);
  } else if (o.v === 1) {
    for (let cx = o.x + 2; cx < o.x + o.w - 2; cx += 4) {
      for (let cy = o.y + roofH + 3; cy < o.y + o.h - 5; cy += 4) {
        rect(cx, cy, 2, 2, win);
        px(cx + 1, cy + 1, winD);
        px(cx, cy, winD);
      }
    }
    const dw = 5, dx = o.x + Math.floor(o.w / 2) - 2;
    rect(dx, o.y + o.h - 6, dw, 4, '#22222a');
    px(dx + 2, o.y + o.h - 4, accent);
    hline(o.x + Math.floor(o.w / 2) - 4, o.y + o.h, 8, accent);
  } else if (o.v === 2) {
    for (let cy = o.y + roofH + 2; cy < o.y + o.h - 4; cy += 5) {
      for (let cx = o.x + 2; cx < o.x + o.w - 2; cx += 5) {
        rect(cx, cy, 4, 3, win);
        rect(cx, cy, 4, 1, winD);
        rect(cx + 3, cy, 1, 3, winD);
      }
    }
    vline(o.x + Math.floor(o.w / 2), o.y - 6, 6, '#22222a');
    px(o.x + Math.floor(o.w / 2) + 1, o.y - 6, '#d8443e');
    const dw = 8, dx = o.x + Math.floor(o.w / 2) - dw / 2;
    rect(dx, o.y + o.h - 6, dw, 4, '#22222a');
    rect(dx - 1, o.y + o.h - 8, dw + 2, 2, accent);
  }
  if (o.w >= 26) {
    rect(o.x + 4, o.y + 1, 4, 2, '#22222a');
    rect(o.x + o.w - 8, o.y + 1, 5, 2, '#22222a');
  }
}
function drawOffices() {
  const sorted = OFFICES.slice().sort((a, b) => a.y - b.y);
  for (const o of sorted) drawOffice(o);
}

// -------- Pedestrian render --------
function drawPed(p) {
  const x = Math.round(p.x), y = Math.round(p.y);
  rect(x - 1, y + 1, 3, 1, C.shadow);
  const bob = (p.bob | 0) % 2;
  const headY = y - 3 + bob;
  const bodyY = y - 2 + bob;
  const feetY = y - 1 + bob;
  px(x, headY, p.skin);
  px(x, bodyY, p.shirt);
  if (p.dir === 1) px(x - 1, bodyY, p.shirtD);
  else if (p.dir === -1) px(x + 1, bodyY, p.shirtD);
  if (p.moving) {
    if (bob === 0) {
      px(x, feetY, C.pedFeet);
      px(x - p.dir, feetY, p.skin);
    } else {
      px(x, feetY, C.pedFeet);
      px(x + p.dir, feetY, p.skin);
    }
  } else {
    px(x, feetY, C.pedFeet);
  }
}

// -------- Vehicle render --------
function drawBus(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  const seg = segOf(b);
  // When parked at start (prevIdx === atIdx), default to horizontal
  const horizontal = seg.dx === 0 && seg.dy === 0 ? true : Math.abs(seg.dx) >= Math.abs(seg.dy);
  if (horizontal) drawBusH(x, y, seg.dx >= 0 ? 1 : -1, b);
  else drawBusV(x, y, seg.dy > 0 ? 1 : -1, b);
}

function drawBusH(x, y, dir, b) {

  rect(bx, by, len, hgt, b.colorD);

  hline(bx, by, len, b.colorD);
  hline(bx, by + hgt - 1, len, b.colorD);
  for (let i = 0; i < 4; i++) rect(bx + 2 + i * 3, by + 2, 2, 2, C.busWin);
  if (dir > 0) {
    px(bx + len - 1, by + 2, '#fff7c0'); px(bx + len - 1, by + 4, '#fff7c0');

    px(bx, by + 2, '#fff7c0'); px(bx, by + 4, '#fff7c0');

  hline(bx + 1, by + 4, len - 2, '#22222a');

function drawBusV(x, y, dir, b) {

  px(bx + hgt - 1, by + 2, '#1c1410');

function drawTrain(t) {

// -------- Routes (drawn lines) --------
function drawRouteLine(route, alpha = 1) {
  if (route.nodes.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = route.color;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const first = NODES[route.nodes[0]];
  ctx.moveTo(first.x + 0.5, first.y + 0.5);
  for (let i = 1; i < route.nodes.length; i++) {
    const n = NODES[route.nodes[i]];
    ctx.lineTo(n.x + 0.5, n.y + 0.5);
  }
  ctx.stroke();
  ctx.restore();
}

// -------- Simulation state --------
const state = {
  peds: [],
  buses: [],
  cars: [],
  routes: [],         // committed: { nodes: [idx], color, colorD, bus }
  activeRoute: null,  // { nodes: [idx], color, colorD } during drag
  pointer: null,
  train: null,
  trainCooldown: 4,
  t: 0,
};

// -------- Bus --------
// State: bus is "at" route.nodes[atIdx]. While moving, it travels from
// route.nodes[prevIdx] toward route.nodes[atIdx] with parameter t in [0, 1].
function segOf(b) {
  const from = NODES[b.route.nodes[b.prevIdx]];
  const to = NODES[b.route.nodes[b.atIdx]];
  return { dx: to.x - from.x, dy: to.y - from.y };
}

function makeBusForRoute(route) {
  return {
    route,
    atIdx: 0, prevIdx: 0, t: 1,
    x: NODES[route.nodes[0]].x, y: NODES[route.nodes[0]].y,
    dir: 1,
    speed: 22, stopT: 1.0, riders: [], capacity: 6,
    color: route.color, colorD: route.colorD,
    wheel: 0,
  };
}

function stepRouteBus(b, dt) {
  if (b.stopT > 0) {
    b.stopT -= dt;
    if (b.stopT > 0) return;
    // Boarding/alighting at the node we're at
    const arrivedNodeIdx = b.route.nodes[b.atIdx];
    const remaining = [];
    for (const r of b.riders) {
      if (r.dropNodeIdx === arrivedNodeIdx) {
        const here = NODES[arrivedNodeIdx];
        r.path = pathStopToBuilding(here, r.destBuilding);
        r.x = here.x + rand(-2, 2); r.y = here.y + 2;
        r.pi = 0; r.state = 'walk';
        r.targetStopNodeIdx = null;
        r.boardedOnce = true;
        r.moving = true;
        state.peds.push(r);
      } else remaining.push(r);
    }
    b.riders = remaining;
    for (let i = state.peds.length - 1; i >= 0; i--) {
      const p = state.peds[i];
      if (p.state !== 'wait') continue;
      if (p.targetStopNodeIdx !== arrivedNodeIdx) continue;
      if (p.routeId !== b.route.id) continue;
      if (b.riders.length >= b.capacity) break;
      if (b.route.nodes.indexOf(p.dropNodeIdx) < 0) continue;
      b.riders.push(p);
      state.peds.splice(i, 1);
    }
    // Advance to next stop along the route
    let next = b.atIdx + b.dir;
    if (next < 0 || next >= b.route.nodes.length) {
      b.dir = -b.dir;
      next = b.atIdx + b.dir;
      // Single-node routes can't happen (we require >=2), so next is valid.
    }
    b.prevIdx = b.atIdx;
    b.atIdx = next;
    b.t = 0;
    return;
  }
  // Move from prevIdx toward atIdx
  const from = NODES[b.route.nodes[b.prevIdx]];
  const to = NODES[b.route.nodes[b.atIdx]];
  const segLen = Math.hypot(to.x - from.x, to.y - from.y) || 1;
  b.t += b.speed * dt / segLen;
  if (b.t >= 1) {
    b.t = 1;
    b.x = to.x; b.y = to.y;
    b.stopT = 1.4;
    return;
  }
  b.x = from.x + (to.x - from.x) * b.t;
  b.y = from.y + (to.y - from.y) * b.t;
  b.wheel += b.speed * dt * 0.7;
}

function stepCar(car, dt) { car.x += car.dir * car.speed * dt; }

// -------- Train --------
function spawnTrain() {
  const dir = rng() < 0.5 ? 1 : -1;
  state.train = {
    x: dir > 0 ? -60 : W + 60, dir, speed: 50,
    smoke: [], smokeT: 0,
  };
}
function stepTrain(dt) {
  if (state.train) {
    const t = state.train;
    t.x += t.dir * t.speed * dt;
    t.smokeT -= dt;
    if (t.smokeT <= 0) {
      t.smokeT = 0.07;
      t.smoke.push({
        x: t.x + (t.dir > 0 ? 12 : -12) + rand(-1, 1),
        y: TRAIN_RAIL_Y - 5 + rand(-1, 1),
        life: 1, vy: -rand(4, 7), vx: rand(-2, 2),
      });
    }
    for (let i = t.smoke.length - 1; i >= 0; i--) {
      const s = t.smoke[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 0.9;
      if (s.life <= 0) t.smoke.splice(i, 1);
    }
    if ((t.dir > 0 && t.x > W + 130) || (t.dir < 0 && t.x < -130)) {
      state.train = null;
      state.trainCooldown = rand(8, 18);
    }
  } else {
    state.trainCooldown -= dt;
    if (state.trainCooldown <= 0) spawnTrain();
  }
}

// -------- Pedestrians --------
function makePed() {
  return {
    x: 0, y: 0, path: [], pi: 0,
    state: 'walk',
    targetStopNodeIdx: null,
    dropNodeIdx: null,
    routeId: null,
    home: null,
    destBuilding: null,
    shirt: pick(PED_SHIRTS),
    shirtD: '#22222a',
    skin: C.pedSkin,
    speed: rand(0.20, 0.36),
    dir: 1, bob: 0, moving: true,
    timer: 0,
    journey: 'toWork',
    boardedOnce: false,
  };
}

function pathBuildingToStop(b, stopNode) {
  // Building → stop (Manhattan path along x then y; through grass and roads).
  const sx = b.x + Math.floor(b.w / 2);
  const sy = (b.y < stopNode.y) ? b.y + b.h + 1 : b.y - 1; // exit on side facing stop
  return [
    { x: sx, y: sy },
    { x: sx, y: stopNode.y },
    { x: stopNode.x, y: stopNode.y },
  ];
}

function pathStopToBuilding(stopNode, b) {
  const sx = b.x + Math.floor(b.w / 2);
  const sy = (b.y < stopNode.y) ? b.y + b.h + 1 : b.y - 1;
  return [
    { x: stopNode.x, y: stopNode.y },
    { x: sx, y: stopNode.y },
    { x: sx, y: sy },
  ];
}

function pathBuildingToBuilding(a, b) {
  // Direct walk (no bus). Manhattan.
  const ax = a.x + Math.floor(a.w / 2);
  const ay = (a.y < b.y) ? a.y + a.h + 1 : a.y - 1;
  const bx = b.x + Math.floor(b.w / 2);
  const by = (b.y < a.y) ? b.y + b.h + 1 : b.y - 1;
  // Mid: pick a y around the road area to use the road network visually
  const midY = (Math.abs(ay - 100) < Math.abs(ay - 210)) ? 100 : 210;
  return [
    { x: ax, y: ay },
    { x: ax, y: midY },
    { x: bx, y: midY },
    { x: bx, y: by },
  ];
}

function nearestNodeIdxToPoint(pt) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < NODES.length; i++) {
    const d = Math.hypot(NODES[i].x - pt.x, NODES[i].y - pt.y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function findRouteForTrip(homeNodeIdx, destNodeIdx) {
  // Returns committed route containing both, or null.
  for (const r of state.routes) {
    if (r.nodes.includes(homeNodeIdx) && r.nodes.includes(destNodeIdx) && homeNodeIdx !== destNodeIdx) {
      return r;
    }
  }
  return null;
}

function spawnOutbound() {
  const home = pick(HOUSES);
  const office = pick(OFFICES);
  const homeCenter = { x: home.x + home.w/2, y: home.y + home.h/2 };
  const destCenter = { x: office.x + office.w/2, y: office.y + office.h/2 };
  const homeStopIdx = nearestNodeIdxToPoint(homeCenter);
  const destStopIdx = nearestNodeIdxToPoint(destCenter);
  const route = findRouteForTrip(homeStopIdx, destStopIdx);

  const p = makePed();
  p.home = home;
  p.destBuilding = office;
  p.journey = 'toWork';

  if (route) {
    // Walk to home stop, board, ride to dest stop, walk to office
    const stopNode = NODES[homeStopIdx];
    p.path = pathBuildingToStop(home, stopNode);
    p.x = p.path[0].x; p.y = p.path[0].y;
    p.targetStopNodeIdx = homeStopIdx;
    p.dropNodeIdx = destStopIdx;
    p.routeId = route.id;
  } else {
    // No route — walk all the way (street ambience)
    p.path = pathBuildingToBuilding(home, office);
    p.x = p.path[0].x; p.y = p.path[0].y;
    p.targetStopNodeIdx = null;
    p.dropNodeIdx = null;
    p.routeId = null;
    p.boardedOnce = true; // skip wait
  }
  state.peds.push(p);
}

function spawnReturning() {
  const office = pick(OFFICES);
  const home = pick(HOUSES);
  const homeCenter = { x: home.x + home.w/2, y: home.y + home.h/2 };
  const destCenter = { x: office.x + office.w/2, y: office.y + office.h/2 };
  const homeStopIdx = nearestNodeIdxToPoint(homeCenter);
  const destStopIdx = nearestNodeIdxToPoint(destCenter);
  const route = findRouteForTrip(destStopIdx, homeStopIdx);

  const p = makePed();
  p.home = home;
  p.destBuilding = home;
  p.journey = 'toHome';

  if (route) {
    const stopNode = NODES[destStopIdx];
    p.path = pathBuildingToStop(office, stopNode);
    p.x = p.path[0].x; p.y = p.path[0].y;
    p.targetStopNodeIdx = destStopIdx;
    p.dropNodeIdx = homeStopIdx;
    p.routeId = route.id;
  } else {
    p.path = pathBuildingToBuilding(office, home);
    p.x = p.path[0].x; p.y = p.path[0].y;
    p.targetStopNodeIdx = null;
    p.dropNodeIdx = null;
    p.routeId = null;
    p.boardedOnce = true;
  }
  state.peds.push(p);
}

function stepPed(p, dt) {
  if (p.state === 'inside') {
    p.timer -= dt;
    if (p.timer <= 0) {
      // Start the opposite trip
      if (p.journey === 'toWork') {
        // Now go home
        const home = pick(HOUSES);
        p.journey = 'toHome';
        const stopAtOfficeIdx = nearestNodeIdxToPoint({ x: p.destBuilding.x + p.destBuilding.w/2, y: p.destBuilding.y + p.destBuilding.h/2 });
        const stopAtHomeIdx = nearestNodeIdxToPoint({ x: home.x + home.w/2, y: home.y + home.h/2 });
        const route = findRouteForTrip(stopAtOfficeIdx, stopAtHomeIdx);
        const start = p.destBuilding;
        if (route) {
          const stopNode = NODES[stopAtOfficeIdx];
          p.path = pathBuildingToStop(start, stopNode);
          p.targetStopNodeIdx = stopAtOfficeIdx;
          p.dropNodeIdx = stopAtHomeIdx;
          p.routeId = route.id;
          p.boardedOnce = false;
        } else {
          p.path = pathBuildingToBuilding(start, home);
          p.routeId = null;
          p.targetStopNodeIdx = null;
          p.boardedOnce = true;
        }
        p.destBuilding = home;
      } else {
        // Now go to work
        const office = pick(OFFICES);
        p.journey = 'toWork';
        const start = p.destBuilding;
        const stopAtHomeIdx = nearestNodeIdxToPoint({ x: start.x + start.w/2, y: start.y + start.h/2 });
        const stopAtOfficeIdx = nearestNodeIdxToPoint({ x: office.x + office.w/2, y: office.y + office.h/2 });
        const route = findRouteForTrip(stopAtHomeIdx, stopAtOfficeIdx);
        if (route) {
          const stopNode = NODES[stopAtHomeIdx];
          p.path = pathBuildingToStop(start, stopNode);
          p.targetStopNodeIdx = stopAtHomeIdx;
          p.dropNodeIdx = stopAtOfficeIdx;
          p.routeId = route.id;
          p.boardedOnce = false;
        } else {
          p.path = pathBuildingToBuilding(start, office);
          p.routeId = null;
          p.targetStopNodeIdx = null;
          p.boardedOnce = true;
        }
        p.destBuilding = office;
      }
      p.x = p.path[0].x; p.y = p.path[0].y;
      p.pi = 0;
      p.state = 'walk';
      p.shirt = pick(PED_SHIRTS);
      p.moving = true;
    }
    return;
  }
  if (p.state === 'enter') {
    p.timer -= dt;
    if (p.timer <= 0) {
      p.state = 'inside';
      p.timer = rand(3.5, 9.5);
    }
    return;
  }
  if (p.state === 'wait') {
    p.moving = false;
    p.dir = (Math.floor(state.t * 1.5) % 2) ? 1 : -1;
    p.timer += dt;
    return;
  }
  // walk
  const tgt = p.path[p.pi];
  if (!tgt) {
    if (p.targetStopNodeIdx !== null && !p.boardedOnce) {
      p.state = 'wait';
      p.timer = 0;
      p.moving = false;
    } else {
      p.state = 'enter';
      p.timer = 0.5;
      p.moving = false;
    }
    return;
  }
  const dx = tgt.x - p.x, dy = tgt.y - p.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.6) { p.pi++; return; }
  const speed = p.speed * dt * 60;
  p.x += (dx / d) * speed;
  p.y += (dy / d) * speed;
  if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 1 : -1;
  p.bob += dt * 9;
  p.moving = true;
}

// -------- Spawn rates --------
let pedSpawnT = 1.0;
let carSpawnT = 0.8;
function tickSpawns(dt) {
  pedSpawnT -= dt;
  if (pedSpawnT <= 0) {
    pedSpawnT = rand(0.4, 1.2);
    if (state.peds.length < 50) {
      if (rng() < 0.55) spawnOutbound(); else spawnReturning();
    }
  }
  carSpawnT -= dt;
  if (carSpawnT <= 0) {
    carSpawnT = rand(3.5, 8.0);
    if (state.cars.length < 4) spawnCar();
  }
}

// -------- Static layer cache --------
const staticCv = document.createElement('canvas');
staticCv.width = W; staticCv.height = H;
const sctx = staticCv.getContext('2d');
sctx.imageSmoothingEnabled = false;

function buildStatic() {
  drawGround();
  drawTrack();
  drawTrainStations();
  drawAsphalt();
  drawSidewalks();
  drawLaneMarkings();
  drawOffices();
  drawHouses();
  drawTrees();
  drawStops();
  sctx.clearRect(0, 0, W, H);
  sctx.drawImage(cv, 0, 0);
}
buildStatic();

// -------- Pointer / route drawing --------
let nextRouteId = 1;

function clientToCanvas(e) {
  const r = cv.getBoundingClientRect();
  const ex = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX));
  const ey = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY));
  return { x: (ex - r.left) * W / r.width, y: (ey - r.top) * H / r.height };
}

function nodeAt(p, maxDist) {
  let best = -1, bd = maxDist * maxDist;
  for (let i = 0; i < NODES.length; i++) {
    const dx = NODES[i].x - p.x, dy = NODES[i].y - p.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = i; }
  }
  return best;
}

function commitRoute(activeRoute) {
  if (!activeRoute || activeRoute.nodes.length < 2) return;
  if (state.routes.length >= ROUTE_COLORS.length) {
    // Replace oldest
    const old = state.routes.shift();
    // remove its bus
    const bi = state.buses.indexOf(old.bus);
    if (bi >= 0) state.buses.splice(bi, 1);
  }
  const idx = nextRouteId++ % ROUTE_COLORS.length;
  const route = {
    id: nextRouteId,
    nodes: activeRoute.nodes.slice(),
    color: ROUTE_COLORS[idx],
    colorD: ROUTE_DARK[idx],
  };
  route.bus = makeBusForRoute(route);
  state.routes.push(route);
  state.buses.push(route.bus);
}

function onPointerDown(e) {
  e.preventDefault();
  const p = clientToCanvas(e);
  const i = nodeAt(p, 12);
  if (i >= 0) {
    const idx = (nextRouteId) % ROUTE_COLORS.length;
    state.activeRoute = {
      nodes: [i],
      color: ROUTE_COLORS[idx],
      colorD: ROUTE_DARK[idx],
    };
  } else {
    state.activeRoute = null;
  }
  state.pointer = p;
}

function onPointerMove(e) {
  if (!state.pointer) return;
  e.preventDefault();
  const p = clientToCanvas(e);
  state.pointer = p;
  if (!state.activeRoute) return;
  const last = state.activeRoute.nodes[state.activeRoute.nodes.length - 1];
  const i = nodeAt(p, 10);
  if (i < 0 || i === last) return;
  // Backtrack: if i is the previous node, drop the current head
  if (state.activeRoute.nodes.length >= 2 &&
      state.activeRoute.nodes[state.activeRoute.nodes.length - 2] === i) {
    state.activeRoute.nodes.pop();
    return;
  }
  if (state.activeRoute.nodes.includes(i)) return; // no loops
  if (!NEIGHBORS[last].includes(i)) return; // must be adjacent
  state.activeRoute.nodes.push(i);
}

function onPointerUp(e) {
  if (state.activeRoute) {
    if (state.activeRoute.nodes.length >= 2) commitRoute(state.activeRoute);
    state.activeRoute = null;
  }
  state.pointer = null;
}

cv.addEventListener('pointerdown', onPointerDown);
cv.addEventListener('pointermove', onPointerMove);
cv.addEventListener('pointerup', onPointerUp);
cv.addEventListener('pointercancel', onPointerUp);
cv.addEventListener('pointerleave', onPointerUp);

// -------- Main loop --------
let lastT = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  state.t += dt;

  tickSpawns(dt);
  for (const p of state.peds) stepPed(p, dt);
  for (const b of state.buses) stepRouteBus(b, dt);
  for (let i = state.cars.length - 1; i >= 0; i--) {
    const car = state.cars[i];
    stepCar(car, dt);
    if (car.x < -16 || car.x > W + 16) state.cars.splice(i, 1);
  }
  stepTrain(dt);

  // Render
  ctx.drawImage(staticCv, 0, 0);

  // Routes (committed) drawn under buses
  for (const r of state.routes) drawRouteLine(r, 0.8);

  // Cars
  for (const car of state.cars) drawCar(car);
  // Buses
  for (const b of state.buses) drawBus(b);
  // Train
  if (state.train) drawTrain(state.train);

  // Peds (skip hidden)
  for (const p of state.peds) {
    if (p.state === 'inside') continue;
    drawPed(p);
  }

  // Active route preview
  if (state.activeRoute) {
    drawRouteLine(state.activeRoute, 0.55);
    // Tail line from last node to pointer
    if (state.pointer) {
      const last = NODES[state.activeRoute.nodes[state.activeRoute.nodes.length - 1]];
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = state.activeRoute.color;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(last.x + 0.5, last.y + 0.5);
      ctx.lineTo(state.pointer.x + 0.5, state.pointer.y + 0.5);
      ctx.stroke();
      ctx.restore();
    }
    // Highlight selectable neighbors of last node
    const last = state.activeRoute.nodes[state.activeRoute.nodes.length - 1];
    for (const ni of NEIGHBORS[last]) {
      if (state.activeRoute.nodes.includes(ni)) continue;
      const n = NODES[ni];
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(state.t * 6);
      ctx.strokeStyle = state.activeRoute.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(n.x - 4, n.y - 4, 9, 9);
      ctx.restore();
    }
  }

  // Vignette
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(0, 0, W, 4);
  ctx.fillRect(0, H - 4, W, 4);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
